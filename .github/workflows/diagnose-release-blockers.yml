name: 发布候选 Windows 阻塞诊断

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  threads:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: ./.github/scripts/prepare-windows-native.ps1
      - name: 安装锁定控制器
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 原预算复演并记录编译子进程
        run: |
          $env:COMPOSER_BINARY = "$env:PHP_HOME/composer.phar"
          ./.github/scripts/probe-release-threads.ps1
      - name: 保全原编译诊断
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-blockers-threads
          retention-days: 30
          path: |
            build/release-blockers-threads/**
            build/release-blockers-thread-consumer/*.log
            build/release-blockers-thread-consumer/build/native/*.json
            build/release-blockers-thread-consumer/build/native/type-app.exe
            build/release-blockers-thread-consumer/build/native/compiler/**

  pgsql:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 取回 RC16 原始教程程序
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38821654510
          name: static-windows-application-evidence-pgsql-tutorial-candidate-1
          path: build/original-pgsql-tutorial
      - run: ./.github/scripts/prepare-windows-native.ps1
      - name: 安装控制器与专用 Redis
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/prepare-windows-test-redis.ps1
      - name: 原 EXE 的普通及隔离租约对照
        run: |
          $taskPath = '.github/scripts/run-windows-database.ps1'
          $taskSource = [IO.File]::ReadAllText($taskPath)
          $taskNeedle = '    if ($Benchmark) {'
          if (($taskSource.Split($taskNeedle).Count - 1) -ne 1) { throw '专用数据库入口不唯一。' }
          $taskReplacement = @'
              if ($env:TYPE_RELEASE_BLOCKER_PROBE -eq '1') {
                  Invoke-TaskProcess $taskPhp @('.github/scripts/probe-release-pgsql.php') (Join-Path $taskEvidence 'probe.log') 600 $taskEnvironment | Out-Null
              } elseif ($Benchmark) {
          '@
          $taskGenerated = '.github/scripts/release-blockers-db.generated.ps1'
          [IO.File]::WriteAllText($taskGenerated, $taskSource.Replace($taskNeedle, $taskReplacement), [Text.UTF8Encoding]::new($false))
          $env:TYPE_RELEASE_BLOCKER_PROBE = '1'
          try { & $taskGenerated -Driver pgsql } finally { Remove-Item -LiteralPath $taskGenerated }
      - name: 保全原程序与租约观察
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-blockers-pgsql
          retention-days: 30
          path: |
            build/release-blockers-pgsql/**
            build/windows-database-*/*.log
            build/windows-database-*/verification.json
