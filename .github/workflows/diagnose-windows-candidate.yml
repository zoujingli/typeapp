name: Windows 原候选安装诊断

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 当前仓库包含 windows-native-evidence 的原发布运行
        required: true
        type: string
      source_sha:
        description: 原运行的完整源码 SHA
        required: true
        type: string
      archive_sha256:
        description: 原 Windows 候选 ZIP 的 SHA-256
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      TYPE_PROBE_RUN: ${{ inputs.run_id }}
      TYPE_PROBE_SOURCE: ${{ inputs.source_sha }}
      TYPE_PROBE_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 核对原运行身份
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:TYPE_PROBE_RUN -cnotmatch '^[1-9][0-9]*$' -or $env:TYPE_PROBE_SOURCE -cnotmatch '^[a-f0-9]{40}$' -or $env:TYPE_PROBE_ARCHIVE_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw '原候选身份格式无效。' }
          $record = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:TYPE_PROBE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $record.head_sha -cne $env:TYPE_PROBE_SOURCE -or $record.path -cne '.github/workflows/release.yml' -or $record.status -ne 'completed') { throw '原发布运行与指定源码不符或尚未结束。' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: windows-native-evidence
          path: build/original-windows-evidence
      - name: 准备锁定测试控制器
        run: ./.github/scripts/prepare-windows-native.ps1
      - name: 安装测试依赖
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 原 ZIP 的空库安装与进程状态测量
        run: ./.github/scripts/run-windows-database.ps1 -Driver pgsql -CandidateProbe
      - name: 保存诊断与精确清理回执
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-candidate-diagnosis
          retention-days: 30
          if-no-files-found: error
          path: |
            build/windows-candidate-probe/*.json
            build/windows-database-*/*.log
            build/windows-database-*/verification.json
