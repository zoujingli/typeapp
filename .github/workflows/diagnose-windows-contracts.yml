name: Windows 发布契约诊断

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: main 历史中的完整源码提交
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 核对固定 main 源码
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == zoujingli/typeapp && "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - name: 准备锁定 Windows ZTS 宿主
        run: ./.github/scripts/prepare-windows-native.ps1
      - name: 安装锁定依赖
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 复演五项失败断言
        run: |
          New-Item -ItemType Directory -Force build/windows-contracts-probe | Out-Null
          & "$env:PHP_HOME/php.exe" vendor/bin/phpunit --filter 'testConfigurationUpdateUsesEffectiveProfileAndProtectsProcessOverrides|testModelsAndServicesShareOneFinalReplacement|testFrozenPlansAreDeterministicAndNeverRewrittenByCompilation|testUnsafeDeclarationsAndSnapshotLinksAreRejected' --log-junit build/windows-contracts-probe/results.xml 2>&1 | Tee-Object build/windows-contracts-probe/results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存最小复现证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-contracts-probe
          retention-days: 30
          if-no-files-found: error
          path: build/windows-contracts-probe/
