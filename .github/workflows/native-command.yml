name: 原生命令验证

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      frontend_artifact:
        required: true
        type: string
      version:
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 完整回归或只复验隔离构建
        type: choice
        options: [all, isolated-build]
        default: all

permissions:
  contents: read

concurrency:
  group: native-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-command:
    name: Linux x64 原生验收 · ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'isolated-build' && '["isolated-build"]' || '["foundation","http","drivers","queries","models","data","cache","queue","scheduler","consumers","reliability","rollout","integration","tls","isolated-build","app","delivery","packaged-rollout","services"]') }}
    services:
      redis:
        image: redis:8.10.1
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: type-app-test-only
          MYSQL_DATABASE: type_app_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptype-app-test-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: type_app
          POSTGRES_PASSWORD: type-app-test-only
          POSTGRES_DB: type_app_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U type_app -d type_app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TYPE_RELEASE_VERSION: ${{ inputs.version }}
      COMPOSER_NO_INTERACTION: '1'
      TYPE_REDIS_HOST: 127.0.0.1
      TYPE_MYSQL_HOST: 127.0.0.1
      TYPE_MYSQL_DATABASE: type_app_test
      TYPE_MYSQL_USER: root
      TYPE_MYSQL_PASSWORD: type-app-test-only
      TYPE_PGSQL_HOST: 127.0.0.1
      TYPE_PGSQL_DATABASE: type_app_test
      TYPE_PGSQL_USER: type_app
      TYPE_PGSQL_PASSWORD: type-app-test-only
    steps:
      - name: 检出已提交源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: 校验 Pull Request 的 DCO 签署
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: php tests/dco.php "$DCO_BASE_SHA" "$DCO_HEAD_SHA"

      - name: 记录本任务的独立数据库与 Redis 端口
        env:
          TYPE_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          TYPE_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          TYPE_PGSQL_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: printf 'TYPE_REDIS_PORT=%s\nTYPE_MYSQL_PORT=%s\nTYPE_PGSQL_PORT=%s\n' "$TYPE_REDIS_PORT" "$TYPE_MYSQL_PORT" "$TYPE_PGSQL_PORT" >> "$GITHUB_ENV"

      - name: 安装锁定的 PHP ZTS 与 Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: dom, filter, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, posix, pcntl, sockets, redis-6.3.0
          tools: composer:2.10.3
          ini-values: memory_limit=2G, display_errors=1, swoole.enable_library=On
        env:
          phpts: ts
          fail-fast: true

      - name: 缓存工具链锁定的 Linux PHP
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/php-sdk/8.5.10-zts
            .cache/php-sdk-build/8.5.10-zts
          key: locked-php-8.5.10-zts-${{ runner.os }}-${{ runner.arch }}-v6

      - name: 换用工具链锁定的 PHP 8.5.10 ZTS
        run: |
          set -euo pipefail
          # setup-php 对 ZTS 只认 8.5，会装上 php-builder 当前补丁；工具链锁仍是 8.5.10。
          task_php="$(php -r 'echo PHP_VERSION, PHP_ZTS ? " zts" : " nts";')"
          if [[ "$task_php" != "8.5.10 zts" ]]; then
            printf 'setup-php 实际版本为 %s，改用源码锁定安装\n' "$task_php"
            task_prefix="$(bash tools/install-locked-linux-php.sh)"
            [[ "$task_prefix" == /* && -x "$task_prefix/bin/php" ]]
            printf '%s/bin\n' "$task_prefix" >> "$GITHUB_PATH"
            export PATH="$task_prefix/bin:$PATH"
            hash -r
          fi
          task_php="$(php -r 'echo PHP_VERSION, PHP_ZTS ? " zts" : " nts";')"
          [[ "$task_php" == "8.5.10 zts" ]] || { printf '锁定 PHP 未生效：%s\n' "$task_php" >&2; exit 1; }
          php -m | grep -E '^(pdo_mysql|pdo_pgsql|pdo_sqlite|redis)$'

      - name: 安装原生构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgmp-dev libmpfr-dev pkg-config libpq-dev libsqlite3-dev libc-ares-dev libcurl4-openssl-dev

      - name: 安装根项目与本地插件
        run: |
          composer validate --strict
          composer install --no-scripts --no-plugins --prefer-dist --no-progress --ignore-platform-req=ext-swoole

      - name: 配置并验证工具链
        shell: bash
        run: |
          task_php_home="$(php tools/configure-toolchain.php "$GITHUB_WORKSPACE/.cache/php-sdk" "$(command -v php-config)")"
          printf 'PHP_HOME=%s\nPHPX_HOME=%s\nLD_LIBRARY_PATH=%s\n' "$task_php_home" "$GITHUB_WORKSPACE/vendor/swoole/phpx" "$GITHUB_WORKSPACE/vendor/swoole/phpx/lib:$task_php_home/lib" >> "$GITHUB_ENV"
          test "$(uname -m)" = x86_64
          php tools/verify-toolchain.php

      - name: 构建 PHPX 原生运行库
        run: bash tools/prepare-toolchain.sh

      - name: 准备原生进程的共享信号扩展
        run: bash .github/scripts/prepare-linux-runtime.sh

      - name: 复用仓库内置的受控 Swoole
        run: bash .github/scripts/prepare-linux-swoole.sh

      - name: 准备并核对内嵌管理前端
        uses: ./.github/actions/prepare-frontend
        with:
          artifact: ${{ inputs.frontend_artifact }}
      - name: 检查源码与公开 PHP 行为
        if: matrix.suite == 'foundation'
        run: |
          composer check
          composer cs-check
          composer test:unit
          composer test:embedded-resources
          composer test:configuration
          composer test:source-rewrites
          composer test:distribution-batch
          composer test:build-cache
          composer test:compiler-tokenizer
          composer test:build-install
          composer test:deployment-budget
          composer test:testing
          composer test:testing-portable
          composer test:testing-consumer
          composer check:assembly
          composer test:validate
          composer test:read-write
          composer test:routing
          composer test:http-trust
          composer test:files
          composer test:log
          composer test:models
          composer test:relations
          composer test:pivots
          composer test:exact-fields
          composer test:lifecycle
          composer test:optimistic
          composer test:scheduler
          composer test:transactions
          composer test:outcomes
          composer test:model-http
          composer test:development-watch

      - name: 验证 PHP Redis 用途、认证与独立消费
        if: matrix.suite == 'cache'
        env:
          TYPE_REDIS_HOST: 127.0.0.1
          TYPE_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          composer test:redis
          composer test:redis-security
          composer test:redis-consumer
          composer test:cache
          composer test:cache-consistency
          composer test:psr-cache
          composer test:cache-consumer
          composer test:scheduler-consumer
          composer test:queue
          composer test:queue-leases
          composer test:queue-retries
          composer test:queue-consumer
          composer test:scheduler-coordination

      - name: 验证SDK共享模块与真实embed衔接
        if: matrix.suite == 'foundation'
        run: |
          php tests/toolchain-configuration.php "$(command -v php-config)"
          if [[ -n "${TYPE_CI_PCNTL_MODULE:-}" ]]; then
            php tests/toolchain-runtime-modules.php "$(command -v php-config)" pcntl "$TYPE_CI_PCNTL_MODULE"
          fi

      - name: 编译并验证主仓原生命令
        if: matrix.suite == 'foundation'
        run: |
          composer test:embed-runtime
          composer test:configuration-root
          composer test:build-source-collection
          composer test:native-conversion
          composer test:native-serialization
          composer build:native
          composer test:native
          composer test:build-errors
          composer build:identity
          composer test:build-identity-native

      - name: 验证独立消费安装与编译
        if: matrix.suite == 'foundation'
        run: composer test:consumer

      - name: 验证第三方源码与资源适配
        if: matrix.suite == 'foundation'
        run: composer test:imports

      - name: 验证原生 Redis 连接与独立消费
        if: matrix.suite == 'cache'
        env:
          TYPE_REDIS_HOST: 127.0.0.1
          TYPE_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          composer build:redis
          composer test:redis-native
          composer build:cache
          composer test:cache-native
          composer build:cache-consistency
          composer test:cache-consistency-native
          composer build:psr-cache
          composer test:psr-cache-native

      - name: 验证原生队列、租约和重试
        if: matrix.suite == 'queue'
        run: |
          composer build:queue
          composer test:queue-native
          composer build:queue-leases
          composer test:queue-leases-native
          composer build:queue-retries
          composer test:queue-retries-native

      - name: 编译并验证声明式命令装配
        if: matrix.suite == 'foundation'
        run: |
          composer build:commands
          composer test:commands
          composer test:assembly-consumer

      - name: 验证原生调度与中断恢复
        if: matrix.suite == 'scheduler'
        run: |
          composer build:scheduler
          composer test:scheduler-native
          composer test:scheduler-native-consumer
          composer test:scheduler-coordination-native
          TYPE_TEST_EXECUTION=host composer test:native-roles

      - name: 验证真实 MySQL 与独立数据命令
        if: matrix.suite == 'drivers'
        env:
          TYPE_MYSQL_HOST: 127.0.0.1
          TYPE_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          TYPE_MYSQL_DATABASE: type_app_test
          TYPE_MYSQL_PASSWORD: type-app-test-only
        run: |
          composer build:mysql
          composer test:mysql
          composer test:mysql-consumer
          composer test:tasks
          composer build:tasks
          composer test:tasks-native
          composer test:backpressure
          composer build:backpressure
          composer test:backpressure-native

      - name: 验证真实 PostgreSQL 与独立数据命令
        if: matrix.suite == 'drivers'
        env:
          TYPE_PGSQL_HOST: 127.0.0.1
          TYPE_PGSQL_PORT: ${{ job.services.postgres.ports['5432'] }}
          TYPE_PGSQL_DATABASE: type_app_test
          TYPE_PGSQL_USER: type_app
          TYPE_PGSQL_PASSWORD: type-app-test-only
        run: |
          composer build:pgsql
          composer test:pgsql
          composer test:pgsql-consumer

      - name: 验证 SQLite 文件、内存与崩溃恢复
        if: matrix.suite == 'drivers'
        run: |
          composer build:sqlite
          composer test:sqlite
          composer test:sqlite-consumer

      - name: 验证编译消息与真实并发 HTTP
        if: matrix.suite == 'http'
        run: |
          composer build:http-messages
          composer test:http-messages
          composer build:http
          composer test:http
          composer build:validate
          composer test:validate-native
          composer build:routing
          composer test:routing-native
          composer build:http-trust
          composer test:http-trust-native
          composer build:files
          composer test:files-native
          TYPE_TEST_EXECUTION=host composer test:files-pressure
          composer build:log
          composer test:log-native

      - name: 验证三库查询、批量操作和能力差异
        if: matrix.suite == 'queries'
        env:
          TYPE_MYSQL_HOST: 127.0.0.1
          TYPE_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          TYPE_MYSQL_DATABASE: type_app_test
          TYPE_MYSQL_PASSWORD: type-app-test-only
          TYPE_PGSQL_HOST: 127.0.0.1
          TYPE_PGSQL_PORT: ${{ job.services.postgres.ports['5432'] }}
          TYPE_PGSQL_DATABASE: type_app_test
          TYPE_PGSQL_USER: type_app
          TYPE_PGSQL_PASSWORD: type-app-test-only
        run: |
          composer build:query
          composer test:query
          composer test:pagination
          composer build:pagination
          composer test:pagination-native

      - name: 验证三库原生迁移、统一入口与独立安装
        if: matrix.suite == 'queries'
        env:
          TYPE_MYSQL_HOST: 127.0.0.1
          TYPE_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          TYPE_MYSQL_DATABASE: type_app_test
          TYPE_MYSQL_PASSWORD: type-app-test-only
          TYPE_PGSQL_HOST: 127.0.0.1
          TYPE_PGSQL_PORT: ${{ job.services.postgres.ports['5432'] }}
          TYPE_PGSQL_DATABASE: type_app_test
          TYPE_PGSQL_USER: type_app
          TYPE_PGSQL_PASSWORD: type-app-test-only
        run: |
          composer build:migrations
          composer test:migrations
          composer test:migrations-consumer

      - name: 验证三库模型与编译 HTTP CRUD
        if: matrix.suite == 'models'
        env:
          TYPE_REDIS_HOST: 127.0.0.1
          TYPE_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          TYPE_MYSQL_HOST: 127.0.0.1
          TYPE_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          TYPE_MYSQL_DATABASE: type_app_test
          TYPE_MYSQL_PASSWORD: type-app-test-only
          TYPE_PGSQL_HOST: 127.0.0.1
          TYPE_PGSQL_PORT: ${{ job.services.postgres.ports['5432'] }}
          TYPE_PGSQL_DATABASE: type_app_test
          TYPE_PGSQL_USER: type_app
          TYPE_PGSQL_PASSWORD: type-app-test-only
        run: |
          composer build:models
          composer test:models-native
          composer build:relations
          composer test:relations-native
          composer build:pivots
          composer test:pivots-native
          composer build:exact-fields
          composer test:exact-fields-native
          composer build:lifecycle
          composer test:lifecycle-native
          composer build:optimistic
          composer test:optimistic-native

      - name: 准备主从选路的独立本机数据库工具
        if: matrix.suite == 'data'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mysql-server mysql-client postgresql
          sudo systemctl stop mysql postgresql
          for task_service in mysql postgresql; do
            if systemctl is-active --quiet "$task_service"; then exit 1; fi
          done
          task_mysql="$GITHUB_WORKSPACE/.cache/routing-mysql"
          mkdir -p "$task_mysql/bin"
          # Ubuntu 的 mysqld AppArmor 规则按真实路径限制自定义数据目录；复制到
          # 本轮工具根后启动，仍由当前测试用户持有，避免触碰系统实例或共享目录。
          cp -L "$(command -v mysqld)" "$task_mysql/bin/mysqld"
          for task_program in mysql mysqldump; do ln -s "$(command -v "$task_program")" "$task_mysql/bin/$task_program"; done
          ln -s /usr/share "$task_mysql/share"
          printf 'TYPE_MYSQL_TOOLS=%s\nTYPE_PGSQL_TOOLS=%s\n' "$task_mysql" "$(dirname "$(pg_config --bindir)")" >> "$GITHUB_ENV"

      - name: 验证原生事务、连接身份、Outbox 与租户
        if: matrix.suite == 'data'
        run: |
          composer build:transactions
          composer test:transactions-native
          composer build:outcomes
          composer test:outcomes-native
          composer build:identities
          composer test:identities-native
          composer build:read-write
          composer test:read-write-native
          composer build:outbox
          composer test:outbox-native
          composer test:tenant-http
          composer build:tenant-http
          composer test:tenant-http-native

      - name: 验证三库独立模型业务与应用模板
        if: matrix.suite == 'consumers'
        run: |
          composer test:orm-suite
          composer test:orm-suite-native
          composer test:template
          bash tools/test-template-deployment.sh mysql --host
          bash tools/test-template-deployment.sh pgsql --host
          bash tools/test-template-deployment.sh sqlite --host

      - name: 验证无 PHP CLI 与业务源码的隔离执行
        if: matrix.suite == 'foundation'
        shell: bash
        run: |
          task_sandbox="$(bash tools/make-native-sandbox.sh build/native/type-app)"
          php tests/native.php --chroot "$task_sandbox"
          task_command_sandbox="$(bash tools/make-native-sandbox.sh build/commands/type-app)"
          php tests/assembled-native.php --chroot "$task_command_sandbox"

      - name: 验证断网只读的无源码运行镜像
        if: matrix.suite == 'foundation'
        run: |
          composer test:native-packaging
          TYPE_TEST_EXECUTION=host composer test:clean-runtime

      - name: 验证持久化、满载与进程停止的真实原生恢复
        if: matrix.suite == 'reliability'
        shell: bash
        run: |
          TYPE_COMPOSER_PHAR="$(command -v composer)" TYPE_TEST_EXECUTION=host TYPE_RELIABILITY_NATIVE=1 bash tools/test-task-reliability.sh

      - name: 验证三库原生共存与二进制回滚
        if: matrix.suite == 'rollout'
        run: |
          composer build:rollout
          TYPE_TEST_EXECUTION=host TYPE_ROLLOUT_NATIVE=1 bash tools/test-rollout.sh mysql
          TYPE_TEST_EXECUTION=host TYPE_ROLLOUT_NATIVE=1 bash tools/test-rollout.sh pgsql
          TYPE_TEST_EXECUTION=host TYPE_ROLLOUT_NATIVE=1 bash tools/test-rollout.sh sqlite

      - name: 验证全部分发组件的三库原生集成与采样报告
        if: matrix.suite == 'integration'
        run: TYPE_TEST_EXECUTION=host TYPE_INTEGRATION_ISOLATED=1 composer test:integration-native

      - name: 验证原生数据库与 Redis 的 TLS 边界
        if: matrix.suite == 'tls'
        run: |
          composer build:tls
          TYPE_TEST_EXECUTION=host composer test:tls-native

      - name: 验证断网只读快照的完整原生构建
        if: matrix.suite == 'isolated-build'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          TYPE_TEST_EXECUTION=host TYPE_PHPX_SDK="$PHPX_HOME" composer test:isolated-build

      - name: 验证物联中心标准项目、配置声明与显式缓存事务
        if: matrix.suite == 'app'
        run: |
          composer typeapp:prepare
          php tests/iot-identity.php --php mysql --app
          php tests/iot-identity.php --php pgsql --app
          php tests/iot-identity.php --php sqlite --app
          composer test:operations
          composer build:operations
          composer test:operations-native
          composer typeapp:build
          composer typeapp:test-native
          php tests/iot-identity.php build/app/type-app sqlite --app
          for task_driver in mysql pgsql sqlite; do
            php tests/application-template.php "$task_driver" --onboarding --native --package
          done

      - name: 验证发布归档及三库无源码备份恢复
        if: matrix.suite == 'delivery'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3 bubblewrap util-linux
          composer typeapp:build
          php tests/native-package.php build/app/type-app --archive
          composer test:service-definition
          php vendor/bin/type package build/app/type-app build/ci-linux-release .env.example > build/ci-linux-release.json
          # 保留PHP变量，不让shell展开。
          # shellcheck disable=SC2016
          task_release_sha="$(php -r '$r=json_decode(file_get_contents("build/ci-linux-release.json"),true,512,JSON_THROW_ON_ERROR);echo $r["manifest-sha256"];')"
          for task_driver in mysql pgsql sqlite; do
            php tests/native-package-clean.php build/ci-linux-release "$task_release_sha" "$task_driver" --recover
          done
          if [[ -n "$TYPE_RELEASE_VERSION" ]]; then
            TYPE_BWRAP_BINARY="$(command -v bwrap)"
            export TYPE_BWRAP_BINARY
            php tests/release-candidate.php prepare
            for task_driver in mysql pgsql sqlite; do php tests/release-candidate.php test "$task_driver"; done
            php tests/release-candidate.php finish
          fi

      - name: 验证三库无源码双版本升级与回滚
        if: matrix.suite == 'packaged-rollout'
        shell: bash
        run: |
          task_identity="$(php -r 'echo bin2hex(random_bytes(6));')"
          php tests/prepare-packaged-rollout.php "$task_identity"
          task_preparation="build/packaged-rollout-build-$task_identity/preparation.json"
          test -f "$task_preparation"
          for task_driver in mysql pgsql sqlite; do
            php tests/packaged-rollout.php "$task_preparation" "$task_driver"
          done

      - name: 验证原生systemd服务完整生命周期
        if: matrix.suite == 'services'
        run: bash .github/scripts/run-linux-service.sh

      - name: 保存最终发布候选
        if: inputs.version != '' && matrix.suite == 'delivery'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-linux-x64-${{ github.run_attempt }}
          path: build/release-candidate/attachments/*
          if-no-files-found: error
          retention-days: 90

      - name: 保存构建身份与原生产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: type-app-linux-x64-${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/**/*.build.json
            build/**/verification.json
            build/packaged-rollout-build-*/preparation.json
            build/packaged-rollout-build-*/old.log
