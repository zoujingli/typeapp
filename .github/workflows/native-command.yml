name: 原生命令验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 完整回归或只复验隔离构建
        type: choice
        options: [all, isolated-build]
        default: all

permissions:
  contents: read

concurrency:
  group: native-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-command:
    name: Linux x64 原生验收 · ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'isolated-build' && '["isolated-build"]' || '["foundation","http","drivers","queries","models","data","cache","queue","scheduler","consumers","reliability","rollout","integration","tls","isolated-build","app","delivery","packaged-rollout","services"]') }}
    services:
      redis:
        image: redis:8.10.1
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: type-app-test-only
          MYSQL_DATABASE: type_app_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptype-app-test-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: type_app
          POSTGRES_PASSWORD: type-app-test-only
          POSTGRES_DB: type_app_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U type_app -d type_app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      COMPOSER_NO_INTERACTION: '1'
      TYPE_REDIS_HOST: 127.0.0.1
      TYPE_MYSQL_HOST: 127.0.0.1
      TYPE_MYSQL_DATABASE: type_app_test
      TYPE_MYSQL_USER: root
      TYPE_MYSQL_PASSWORD: type-app-test-only
      TYPE_PGSQL_HOST: 127.0.0.1
      TYPE_PGSQL_DATABASE: type_app_test
      TYPE_PGSQL_USER: type_app
      TYPE_PGSQL_PASSWORD: type-app-test-only
    steps:
      - name: 检出已提交源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 校验 Pull Request 的 DCO 签署
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: php tests/dco.php "$DCO_BASE_SHA" "$DCO_HEAD_SHA"

      - name: 记录本任务的独立数据库与 Redis 端口
        env:
          TYPE_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          TYPE_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          TYPE_PGSQL_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: printf 'TYPE_REDIS_PORT=%s\nTYPE_MYSQL_PORT=%s\nTYPE_PGSQL_PORT=%s\n' "$TYPE_REDIS_PORT" "$TYPE_MYSQL_PORT" "$TYPE_PGSQL_PORT" >> "$GITHUB_ENV"

      - name: 安装锁定的 PHP ZTS 与 Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: dom, filter, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, posix, pcntl, sockets, swoole-6.2.1, redis-6.3.0
          tools: composer:2.10.3
          ini-values: memory_limit=2G, display_errors=1, swoole.enable_library=On
        env:
          phpts: ts
          fail-fast: true
          SWOOLE_CONFIGURE_OPTS: --enable-swoole-thread

      - name: 缓存工具链锁定的 Linux PHP
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/php-sdk/8.5.10-zts
            .cache/php-sdk-build/8.5.10-zts
          key: locked-php-8.5.10-zts-${{ runner.os }}-${{ runner.arch }}-v3

      - name: 换用工具链锁定的 PHP 8.5.10 ZTS
        run: |
          set -euo pipefail
          # setup-php 对 ZTS 只认 8.5，会装上 php-builder 当前补丁；工具链锁仍是 8.5.10。
          task_php="$(php -r 'echo PHP_VERSION, PHP_ZTS ? " zts" : " nts";')"
          if [[ "$task_php" != "8.5.10 zts" ]]; then
            printf 'setup-php 实际版本为 %s，改用源码锁定安装
' "$task_php"
            task_prefix="$(bash tools/install-locked-linux-php.sh)"
            [[ "$task_prefix" == /* && -x "$task_prefix/bin/php" ]]
            printf '%s/bin
' "$task_prefix" >> "$GITHUB_PATH"
            export PATH="$task_prefix/bin:$PATH"
            hash -r
          fi
          task_php="$(php -r 'echo PHP_VERSION, PHP_ZTS ? " zts" : " nts";')"
          [[ "$task_php" == "8.5.10 zts" ]] || { printf '锁定 PHP 未生效：%s
' "$task_php" >&2; exit 1; }
          php -m | grep -E '^(pdo_mysql|pdo_pgsql|pdo_sqlite|redis)$'
