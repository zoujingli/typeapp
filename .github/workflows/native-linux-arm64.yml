name: Linux ARM64 原生全业务回归

on:
  workflow_dispatch:
    inputs:
      base_source:
        description: 用于性能比较的完整基准提交，留空时不运行性能组
        required: false
        type: string

permissions:
  contents: read

jobs:
  native-regression:
    if: github.repository == 'zoujingli/typeapp'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.base_source != '' && '["contracts","orm","database","http","redis","tasks","application","recovery","rollout","benchmark"]' || '["contracts","orm","database","http","redis","tasks","application","recovery","rollout"]') }}
    env:
      TYPE_BASE_SOURCE: ${{ inputs.base_source }}
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '1800'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: dom, filter, ctype, tokenizer, mbstring, iconv, pdo_mysql, pdo_pgsql, pdo_sqlite, posix, pcntl, sockets, openssl, curl, zip, swoole-6.2.1, redis-6.3.0
          tools: composer:2.10.3
          ini-values: memory_limit=2G, display_errors=1, swoole.enable_library=On, date.timezone=UTC
        env:
          phpts: ts
          fail-fast: true
          SWOOLE_CONFIGURE_OPTS: --enable-sockets --enable-mysqlnd --enable-cares --enable-swoole-thread --enable-swoole-pgsql --enable-swoole-sqlite
          SWOOLE_LINUX_LIBS: libc-ares-dev, libpq-dev, libsqlite3-dev
      - name: 缓存工具链锁定的 Linux PHP
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/php-sdk/8.5.10-zts
            .cache/php-sdk-build/8.5.10-zts
          key: locked-php-8.5.10-zts-${{ runner.os }}-${{ runner.arch }}-v3
      - name: 换用工具链锁定的 PHP 8.5.10 ZTS
        run: |
          set -euo pipefail
          # setup-php 对 ZTS 只认 8.5，会装上 php-builder 当前补丁；工具链锁仍是 8.5.10。
          task_php="$(php -r 'echo PHP_VERSION, PHP_ZTS ? " zts" : " nts";')"
          if [[ "$task_php" != "8.5.10 zts" ]]; then
            printf 'setup-php 实际版本为 %s，改用源码锁定安装
' "$task_php"
            task_prefix="$(bash tools/install-locked-linux-php.sh)"
            [[ "$task_prefix" == /* && -x "$task_prefix/bin/php" ]]
            printf '%s/bin
' "$task_prefix" >> "$GITHUB_PATH"
            export PATH="$task_prefix/bin:$PATH"
            hash -r
          fi
          task_php="$(php -r 'echo PHP_VERSION, PHP_ZTS ? " zts" : " nts";')"
          [[ "$task_php" == "8.5.10 zts" ]] || { printf '锁定 PHP 未生效：%s
' "$task_php" >&2; exit 1; }
          php -m | grep -E '^(pdo_mysql|pdo_pgsql|pdo_sqlite|redis)$'
