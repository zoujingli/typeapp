name: macOS ARM64 原生验收

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_source:
        description: 用于性能比较的完整基准提交，留空时不运行性能组
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'zoujingli/typeapp'
    name: macOS ARM64 · ${{ matrix.suite }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: ${{ fromJSON(inputs.base_source != '' && '["contracts","application","deployment","rollout","recovery","http","orm","reliable","benchmark"]' || '["contracts","application","deployment","rollout","recovery","http","orm","reliable"]') }}
    env:
      TYPE_BASE_SOURCE: ${{ inputs.base_source }}
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '1800'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 安装原生构建和专用测试数据库工具
        run: |
          brew install cmake gmp mpfr pcre2 pkg-config libpq mysql@8.4 postgresql@17 redis
          # PHP 的 pcre 扩展头文件会直接包含 pcre2.h；setup-php 编译 Swoole
          # 时需要它位于标准 Homebrew include 路径中。
          task_pcre2="$(brew --prefix pcre2)"
          brew link --force --overwrite pcre2
          test -f "$task_pcre2/include/pcre2.h"
          # setup-php 通过 sudo pecl 构建 Swoole，不保留自定义 CFLAGS；
          # macOS clang 默认搜索 /usr/local/include，建立标准头文件接缝。
          sudo mkdir -p /usr/local/include
          sudo ln -sf "$task_pcre2/include/pcre2.h" /usr/local/include/pcre2.h
          sudo ln -sf "$task_pcre2/include/pcre2posix.h" /usr/local/include/pcre2posix.h
          test -f /usr/local/include/pcre2.h
          printf 'PCRE2_PREFIX=%s\n' "$task_pcre2" >> "$GITHUB_ENV"
      - name: 暴露 PostgreSQL 构建头文件与 pkg-config
        run: |
          # setup-php 的 pdo_pgsql 使用 Homebrew libpq；Swoole 必须链接同一
          # 个 dylib 身份。postgresql@17 仅提供本轮隔离数据库服务和客户端工具。
          task_pgsql="$(brew --prefix libpq)"
          task_pgsql_include="$task_pgsql/include"
          task_pgsql_lib="$task_pgsql/lib"
          [[ -f "$task_pgsql_include/libpq-fe.h" && -f "$task_pgsql_lib/libpq.dylib" ]] || exit 1
          task_pgsql_pkg="$RUNNER_TEMP/libpq-pkgconfig"
          mkdir -p "$task_pgsql_pkg"
          {
            printf 'prefix=%s\n' "$task_pgsql"
            printf 'exec_prefix=${prefix}\nlibdir=%s\nincludedir=%s\n' "$task_pgsql_lib" "$task_pgsql_include"
            printf 'Name: libpq\nDescription: PostgreSQL client library\nVersion: 17\nLibs: -L%s -lpq\nCflags: -I%s\n' "$task_pgsql_lib" "$task_pgsql_include"
          } > "$task_pgsql_pkg/libpq.pc"
          # setup-php 用 sudo 执行 PECL configure，sudo 默认不会保留 LIBPQ_*。
          # 直接传入 Swoole 的 PostgreSQL 前缀，让其在 configure 内部构造
          # 自己的 pkg-config 路径，避免依赖被清掉的外部环境变量。
          task_swoole_pgsql="$RUNNER_TEMP/libpq-prefix"
          mkdir -p "$task_swoole_pgsql/lib/pkgconfig"
          cp "$task_pgsql_pkg/libpq.pc" "$task_swoole_pgsql/lib/pkgconfig/libpq.pc"
          printf 'SWOOLE_CONFIGURE_OPTS=--enable-sockets --enable-mysqlnd --enable-cares --enable-swoole-thread --enable-swoole-pgsql=%s --enable-swoole-sqlite\n' "$task_swoole_pgsql" >> "$GITHUB_ENV"
          printf 'PKG_CONFIG_PATH=%s:%s\nCPPFLAGS=-I%s -I%s/include %s\nLDFLAGS=-L%s -L%s/lib %s\nLIBPQ_CFLAGS=-I%s\nLIBPQ_LIBS=-L%s -lpq\n' \
            "$task_pgsql_pkg" "${PKG_CONFIG_PATH:-}" "$task_pgsql_include" "$PCRE2_PREFIX" "${CPPFLAGS:-}" "$task_pgsql_lib" "$PCRE2_PREFIX" "${LDFLAGS:-}" "$task_pgsql_include" "$task_pgsql_lib" >> "$GITHUB_ENV"
      - name: 将 Homebrew ZTS PHP 固定到锁定补丁
        run: |
          # setup-php 把 8.5.10 截成 8.5，再安装 php-zts 的当前补丁。
          # 工具链锁定仍是 8.5.10。先把 tap 停在最后一版 8.5.10_1 瓶，
          # 并且目录必须已经存在，setup-php 才不会改拉默认分支。
          brew tap shivammathur/php
          task_php_tap="$(brew --repository shivammathur/php)"
          [[ -d "$task_php_tap/.git" ]]
          git -C "$task_php_tap" fetch --depth 1 origin 0274c190fd1708e4656cdc43b533bbd650c7c937
          git -C "$task_php_tap" checkout --detach --force FETCH_HEAD
          [[ "$(git -C "$task_php_tap" rev-parse HEAD)" == "0274c190fd1708e4656cdc43b533bbd650c7c937" ]]
          grep -F 'php-8.5.10.tar.xz' "$task_php_tap/Formula/php-zts.rb"
          [[ -e "$task_php_tap/Aliases/php@8.5-zts" ]]
      - name: 安装锁定ZTS PHP与Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: dom, filter, ctype, tokenizer, mbstring, iconv, pdo_mysql, pdo_pgsql, pdo_sqlite, posix, pcntl, sockets, openssl, curl, zip, redis-6.3.0, swoole-6.2.2
          ini-values: memory_limit=2G, display_errors=1, swoole.enable_library=On, date.timezone=UTC
          tools: composer:2.10.3
        env:
          phpts: ts
          fail-fast: true
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          SWOOLE_DARWIN_LIBS: c-ares, libpq, sqlite
          CFLAGS: -I/opt/homebrew/opt/pcre2/include
          CXXFLAGS: -I/opt/homebrew/opt/pcre2/include
      - name: 核对 PHP 扩展的 PostgreSQL 动态库身份
        run: |
          task_php="$(php -r 'echo PHP_VERSION, PHP_ZTS ? " zts" : " nts";')"
          [[ "$task_php" == "8.5.10 zts" ]] || { printf '锁定 PHP 未生效：%s\n' "$task_php" >&2; exit 1; }
          # ReflectionExtension 不提供文件路径；从当前 PHP 实际使用的
          # extension_dir 解析已加载模块，避免假设 php-config 的 SDK 目录。
          task_extension_dir="$(php -r 'echo ini_get("extension_dir");')"
          # setup-php 在 macOS 可能以符号链接暴露 PECL 扩展；跟随链接后再
          # 检查真实文件，避免把已加载的 pdo_pgsql 误判为空路径。
          task_pdo_module="$(find -L "$task_extension_dir" -maxdepth 1 -name 'pdo_pgsql.so' -print -quit)"
          task_swoole_module="$(find -L "$task_extension_dir" -maxdepth 1 -name 'swoole.so' -print -quit)"
          [[ -f "$task_swoole_module" ]]
          otool -L "$task_swoole_module" | tee "$RUNNER_TEMP/swoole-otool.log"
          task_swoole_pq="$(otool -L "$task_swoole_module" | awk '/libpq\.5\.dylib/{print $1; exit}')"
          [[ -n "$task_swoole_pq" ]]
          if [[ -n "$task_pdo_module" ]]; then
            otool -L "$task_pdo_module" | tee "$RUNNER_TEMP/pdo-pgsql-otool.log"
            task_pdo_pq="$(otool -L "$task_pdo_module" | awk '/libpq\.5\.dylib/{print $1; exit}')"
            [[ -n "$task_pdo_pq" && "$task_pdo_pq" == "$task_swoole_pq" ]]
          else
            # Swoole 的 macOS PHP 8.5 构建可直接提供 pdo_pgsql；此时没有
            # 独立模块文件可供 otool 检查，但已加载驱动必然使用同一 Swoole
            # 扩展内的 libpq。保留加载状态作为验收证据。
            [[ "$(php -r 'echo extension_loaded("pdo_pgsql") ? "1" : "0";')" == "1" ]]
            printf 'pdo_pgsql=provided-by-swoole\n' | tee "$RUNNER_TEMP/pdo-pgsql-otool.log"
          fi
      - name: 安装锁定组件与开发依赖
        run: |
          composer validate --strict
          composer install --no-scripts --no-plugins --prefer-dist --no-progress
      - name: 固定SDK并构建独立PHPX
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          php tools/verify-toolchain.php macos
          task_php_home="$(php tools/configure-toolchain.php "$GITHUB_WORKSPACE/build/ci-php-sdk" "$(command -v php-config)")"
          task_phpx_home="$GITHUB_WORKSPACE/build/ci-phpx"
          test ! -e "$task_phpx_home"
          mkdir -p "$task_phpx_home"
          rsync -a --exclude='.git/' --exclude='build/' --exclude='lib/' --exclude='*.o' --exclude='*.obj' --exclude='*.a' --exclude='*.so' --exclude='*.dylib' vendor/swoole/phpx/ "$task_phpx_home/"
          export PHP_HOME="$task_php_home" PHPX_HOME="$task_phpx_home"
          bash tools/prepare-toolchain.sh
          php tests/toolchain-configuration.php "$PHP_HOME/bin/php-config"
          task_runtime_ini="$(bash tools/prepare-embed-runtime.sh)"
          # 固定完整控制器INI，独立消费者关闭额外扫描时仍保留所需PDO、Redis和Swoole。
          task_control="$GITHUB_WORKSPACE/.cache/macos-control"
          mkdir -p "$task_control/php.d"
          task_swoole_module="$(bash tools/prepare-swoole-module.sh)"
          printf 'TYPE_SWOOLE_MODULE=%s\n' "$task_swoole_module" >> "$GITHUB_ENV"
          # shellcheck disable=SC2016
          php -r '$ini=php_ini_loaded_file();$text=$ini===false?"":file_get_contents($ini);foreach(explode(",",(string)php_ini_scanned_files()) as $file){if(trim($file)!==""){$text.="\n".file_get_contents(trim($file));}}$text=preg_replace("/^[ \\t]*extension[ \\t]*=.*(?:swoole|curl|tokenizer).*/mi","",$text);if(!is_string($text)||file_put_contents($argv[1],$text)!==strlen($text)||!chmod($argv[1],0600)){exit(1);}' "$task_control/php.ini"
          task_curl_module="$(php-config --extension-dir)/curl.so"
          task_tokenizer_module="$(php-config --extension-dir)/tokenizer.so"
          if [[ ! -f "$task_tokenizer_module" ]]; then
            # 锁定的 php-zts 可能把 tokenizer 编译进主程序，扩展目录没有 tokenizer.so。
            [[ "$(php -r 'echo extension_loaded("tokenizer") && function_exists("token_get_all") ? "1" : "0";')" == "1" ]] || {
              echo "缺少 PHP tokenizer 扩展：$task_tokenizer_module" >&2
              exit 1
            }
            task_tokenizer_module=""
            echo 'tokenizer=provided-by-php' | tee "$RUNNER_TEMP/tokenizer-module.log"
          fi
          if [[ -f "$task_curl_module" ]]; then
            printf 'extension=%s\n' "$task_curl_module" >> "$task_control/php.ini"
          else
            # macOS 的锁定 PHP 可能将 curl 编译进主程序，不产生独立 curl.so。
            # 只要真实 CLI 已加载 curl，embed 会继承同一内置扩展；不要把空路径
            # 当成失败，也不要伪造一个动态模块身份。
            [[ "$(php -r 'echo extension_loaded("curl") ? "1" : "0";')" == "1" ]] || {
              echo "缺少 PHP curl 扩展：$task_curl_module" >&2
              exit 1
            }
            task_curl_module=""
            echo 'curl=provided-by-php' | tee "$RUNNER_TEMP/curl-module.log"
          fi
          if [[ -n "$task_tokenizer_module" ]]; then
            printf 'extension=%s\n' "$task_tokenizer_module" >> "$task_control/php.ini"
          fi
          printf 'extension=%s\n' "$task_swoole_module" >> "$task_control/php.ini"
          task_runtime_clean="$GITHUB_WORKSPACE/.cache/embed-runtime/8.5.10/php.ini.clean"
          awk 'tolower($0) !~ /^[[:space:]]*extension[[:space:]]*=.*(swoole|curl)/' "$task_runtime_ini" > "$task_runtime_clean"
          mv "$task_runtime_clean" "$task_runtime_ini"
          if [[ -n "$task_curl_module" ]]; then
            printf 'extension=%s\n' "$task_curl_module" >> "$task_runtime_ini"
          fi
          printf 'extension=%s\n' "$task_swoole_module" >> "$task_runtime_ini"
          task_runtime_probe="$GITHUB_WORKSPACE/.cache/embed-runtime/8.5.10/probe"
          [[ "$(PHPRC="$task_runtime_ini" PHP_INI_SCAN_DIR="$task_control/php.d" "$task_runtime_probe")" == '1 1 1 1' ]]
          printf 'TYPE_CURL_MODULE=%s\nPHP_HOME=%s\nPHPX_HOME=%s\nTYPE_NATIVE_PHP_INI=%s\nPHPRC=%s\nPHP_INI_SCAN_DIR=%s\nCOMPOSER_BINARY=%s\n' \
            "$task_curl_module" "$PHP_HOME" "$PHPX_HOME" "$task_runtime_ini" "$task_control/php.ini" "$task_control/php.d" "$(command -v composer)" >> "$GITHUB_ENV"
      - name: 运行真实原生验收
        env:
          TYPE_MACOS_SUITE: ${{ matrix.suite }}
        run: bash .github/scripts/run-macos-native.sh "$TYPE_MACOS_SUITE"
      - name: 保存构建与验证结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-${{ matrix.suite }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/**/verification.json
            build/**/*.build.json
            build/**/profile.json
            build/**/compile.log
            build/packaged-rollout-build-*/preparation.json
            build/packaged-rollout-build-*/old.log
            build/packaged-rollout-build-*/new.log
            build/packaged-rollout-*/scenario.log
            build/macos-recovery-ci-*/preparation.json
            build/platform-benchmarks-*/preparation.json
            build/platform-benchmarks-*/*/*.log
            build/benchmark-pairs-*/*.log
            build/benchmark-pairs-*/comparison-*.json
