name: macOS ARM64 原生验收

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      frontend_artifact:
        required: true
        type: string
      version:
        required: true
        type: string
      scope:
        description: full 为完整业务回归，single-program 为最终静态候选
        default: full
        type: string
      profile:
        description: 单程序数据库 profile
        required: false
        default: all
        type: string
      base_source:
        default: ''
        type: string
      tutorial_mode:
        default: ''
        type: string
      tutorial_reference:
        default: ''
        type: string
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: main 历史中的完整源码 SHA；留空使用本次事件提交
        required: false
        type: string
      scope:
        description: 验收范围（single-program 为静态候选，benchmark 需提供基准提交）
        type: choice
        options: [full, single-program, tls, pressure, benchmark, toolchain]
        default: full
      candidate_version:
        description: single-program 必填；只验收候选，不创建标签或发布
        type: string
        default: ''
      base_source:
        description: 用于性能比较的完整基准提交，留空时不运行性能组
        required: false
        type: string
      profile:
        description: 单程序数据库 profile
        required: false
        default: sqlite
        type: choice
        options: [sqlite, mysql, pgsql]

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || inputs.source_sha || github.sha }}-${{ inputs.scope || 'full' }}-${{ inputs.scope == 'single-program' && inputs.profile || 'all' }}-${{ inputs.tutorial_mode || 'iot' }}-${{ inputs.base_source }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'zoujingli/typeapp'
    name: ${{ inputs.scope == 'single-program' && inputs.profile || 'all' }} · macOS ARM64 · ${{ inputs.tutorial_mode != '' && format('tutorial-{0}', inputs.tutorial_mode) || matrix.suite }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: ${{ fromJSON(inputs.scope == 'single-program' && '["single-program"]' || inputs.scope == 'tls' && '["tls"]' || inputs.scope == 'pressure' && '["pressure"]' || inputs.scope == 'benchmark' && '["benchmark"]' || inputs.scope == 'toolchain' && '["toolchain"]' || (inputs.base_source != '' && '["contracts","application","deployment","rollout","recovery","http","orm","reliable","toolchain","benchmark"]' || '["contracts","application","deployment","rollout","recovery","http","orm","reliable","toolchain"]')) }}
    env:
      TYPE_BASE_SOURCE: ${{ inputs.base_source }}
      TYPE_RELEASE_VERSION: ${{ inputs.version || inputs.candidate_version }}
      TYPEAPP_BUILD_PROFILE: ${{ inputs.scope == 'single-program' && inputs.profile || '' }}
      TYPE_BENCHMARK_BUILD_TIMING: ${{ inputs.scope == 'single-program' && inputs.base_source != '' && inputs.tutorial_mode == '' && '1' || '0' }}
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '1800'
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      TYPE_TUTORIAL_MODE: ${{ inputs.tutorial_mode }}
      TYPE_TUTORIAL_REFERENCE: ${{ inputs.tutorial_reference }}
      TYPEAPP_BUILD_CONFIGURATION: ${{ inputs.tutorial_mode != '' && format('{0}/examples/catalog/build-profiles.json', github.workspace) || '' }}
    steps:
      - name: 核对手动单程序候选参数
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SCOPE: ${{ inputs.scope }}
        run: |
          if [[ "$CANDIDATE_SCOPE" == single-program ]]; then
            [[ "$TYPE_RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          elif [[ -n "$TYPE_RELEASE_VERSION" ]]; then
            echo 'candidate_version 仅用于 single-program 范围。' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 核对手动入口的固定 main 源码
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == zoujingli/typeapp && "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$(git rev-parse --verify "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          printf 'source=%s\n' "$SOURCE_SHA"
      - name: 安装原生构建和专用测试数据库工具
        run: |
          brew install cmake gmp mpfr pcre2 pkg-config libpq mysql@8.4 postgresql@17 redis autoconf bison re2c libxml2 openssl@3 curl sqlite libzip
          # 系统 LibreSSL 不支持证书签发使用的 -copy_extensions；显式选用已安装的 OpenSSL。
          task_openssl="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$task_openssl"
          "$task_openssl" version
          "$task_openssl" x509 -help 2>&1 | grep -F -- '-copy_extensions' >/dev/null
          printf 'TYPE_OPENSSL_BINARY=%s\n' "$task_openssl" >> "$GITHUB_ENV"
          # PHPX 使用 PHP 扩展头文件中的 pcre2.h；路径从当前 Homebrew 解析。
          task_pcre2="$(brew --prefix pcre2)"
          brew link --force --overwrite pcre2
          test -f "$task_pcre2/include/pcre2.h"
          printf 'PCRE2_PREFIX=%s\nCPPFLAGS=-I%s/include %s\nLDFLAGS=-L%s/lib %s\n' \
            "$task_pcre2" "$task_pcre2" "${CPPFLAGS:-}" "$task_pcre2" "${LDFLAGS:-}" >> "$GITHUB_ENV"
      - name: 将 Homebrew ZTS PHP 固定到锁定补丁
        run: |
          # setup-php 把 8.5.10 截成 8.5，再安装 php-zts 的当前补丁。
          # 工具链锁定仍是 8.5.10。先把 tap 停在最后一版 8.5.10_1 瓶，
          # 并且目录必须已经存在，setup-php 才不会改拉默认分支。
          brew tap shivammathur/php
          task_php_tap="$(brew --repository shivammathur/php)"
          [[ -d "$task_php_tap/.git" ]]
          git -C "$task_php_tap" fetch --depth 1 origin 0274c190fd1708e4656cdc43b533bbd650c7c937
          git -C "$task_php_tap" checkout --detach --force FETCH_HEAD
          [[ "$(git -C "$task_php_tap" rev-parse HEAD)" == "0274c190fd1708e4656cdc43b533bbd650c7c937" ]]
          grep -F 'php-8.5.10.tar.xz' "$task_php_tap/Formula/php-zts.rb"
          [[ -e "$task_php_tap/Aliases/php@8.5-zts" ]]
      - name: 安装锁定ZTS PHP与Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: dom, filter, ctype, tokenizer, mbstring, iconv, pdo_mysql, pdo_pgsql, pdo_sqlite, posix, pcntl, sockets, openssl, curl, zip, redis-6.3.0
          ini-values: memory_limit=2G, display_errors=1, swoole.enable_library=On, date.timezone=UTC
          tools: composer:2.10.3
        env:
          phpts: ts
          fail-fast: true
          MACOSX_DEPLOYMENT_TARGET: '15.0'
      - name: 缓存与内置 Swoole 同配置的 PHP SDK
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/macos-locked-php
            .cache/macos-locked-php-build
          key: locked-macos-php-8.5.10-zts-signals-${{ hashFiles('tools/install-locked-macos-php.sh') }}
      - name: 使用启用 Zend signals 的锁定 SDK
        run: |
          mkdir -p build/macos-locked-sdk
          task_php_home="$(bash tools/install-locked-macos-php.sh 2> >(tee build/macos-locked-sdk/compile.log >&2))"
          printf '%s/bin\n' "$task_php_home" >> "$GITHUB_PATH"
          printf 'PHPRC=%s/etc\nPHP_INI_SCAN_DIR=%s/etc/php.d\n' "$task_php_home" "$task_php_home" >> "$GITHUB_ENV"
      - name: 核对内置 Swoole 与锁定 PHP
        run: |
          task_swoole_module="$(php -n tools/select-swoole-module.php)"
          otool -L "$task_swoole_module" | tee "$RUNNER_TEMP/swoole-otool.log"
          php -d "extension=$task_swoole_module" -r 'if (!extension_loaded("swoole") || Swoole\Thread::NATIVE_ENTRY_ABI !== 2) { exit(1); }'
      - name: 安装锁定组件与开发依赖
        run: |
          composer validate --strict
          composer install --no-scripts --no-plugins --prefer-dist --no-progress --ignore-platform-req=ext-swoole
      - name: 固定SDK并构建独立PHPX
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          php tools/verify-toolchain.php macos
          task_php_home="$(php tools/configure-toolchain.php "$GITHUB_WORKSPACE/build/ci-php-sdk" "$(command -v php-config)")"
          task_phpx_home="$GITHUB_WORKSPACE/build/ci-phpx"
          test ! -e "$task_phpx_home"
          mkdir -p "$task_phpx_home"
          rsync -a --exclude='.git/' --exclude='build/' --exclude='lib/' --exclude='*.o' --exclude='*.obj' --exclude='*.a' --exclude='*.so' --exclude='*.dylib' vendor/swoole/phpx/ "$task_phpx_home/"
          export PHP_HOME="$task_php_home" PHPX_HOME="$task_phpx_home"
          bash tools/prepare-toolchain.sh
          php tests/toolchain-configuration.php "$PHP_HOME/bin/php-config"
          task_runtime_ini="$(bash tools/prepare-embed-runtime.sh)"
          # 固定完整控制器INI，独立消费者关闭额外扫描时仍保留所需PDO、Redis和Swoole。
          task_control="$GITHUB_WORKSPACE/.cache/macos-control"
          mkdir -p "$task_control/php.d"
          task_swoole_module="$(bash tools/prepare-swoole-module.sh)"
          printf 'TYPE_SWOOLE_MODULE=%s\n' "$task_swoole_module" >> "$GITHUB_ENV"
          # shellcheck disable=SC2016
          php -r '$ini=php_ini_loaded_file();$text=$ini===false?"":file_get_contents($ini);foreach(explode(",",(string)php_ini_scanned_files()) as $file){if(trim($file)!==""){$text.="\n".file_get_contents(trim($file));}}$text=preg_replace("/^[ \\t]*extension[ \\t]*=.*(?:swoole|curl|tokenizer).*/mi","",$text);if(!is_string($text)||file_put_contents($argv[1],$text)!==strlen($text)||!chmod($argv[1],0600)){exit(1);}' "$task_control/php.ini"
          task_curl_module="$(php-config --extension-dir)/curl.so"
          task_tokenizer_module="$(php-config --extension-dir)/tokenizer.so"
          if [[ ! -f "$task_tokenizer_module" ]]; then
            # 锁定的 php-zts 可能把 tokenizer 编译进主程序，扩展目录没有 tokenizer.so。
            [[ "$(php -r 'echo extension_loaded("tokenizer") && function_exists("token_get_all") ? "1" : "0";')" == "1" ]] || {
              echo "缺少 PHP tokenizer 扩展：$task_tokenizer_module" >&2
              exit 1
            }
            task_tokenizer_module=""
            echo 'tokenizer=provided-by-php' | tee "$RUNNER_TEMP/tokenizer-module.log"
          fi
          if [[ -f "$task_curl_module" ]]; then
            printf 'extension=%s\n' "$task_curl_module" >> "$task_control/php.ini"
          else
            # macOS 的锁定 PHP 可能将 curl 编译进主程序，不产生独立 curl.so。
            # 只要真实 CLI 已加载 curl，embed 会继承同一内置扩展；不要把空路径
            # 当成失败，也不要伪造一个动态模块身份。
            [[ "$(php -r 'echo extension_loaded("curl") ? "1" : "0";')" == "1" ]] || {
              echo "缺少 PHP curl 扩展：$task_curl_module" >&2
              exit 1
            }
            task_curl_module=""
            echo 'curl=provided-by-php' | tee "$RUNNER_TEMP/curl-module.log"
          fi
          if [[ -n "$task_tokenizer_module" ]]; then
            printf 'extension=%s\n' "$task_tokenizer_module" >> "$task_control/php.ini"
          fi
          printf 'extension=%s\n' "$task_swoole_module" >> "$task_control/php.ini"
          task_runtime_clean="$GITHUB_WORKSPACE/.cache/embed-runtime/8.5.10/php.ini.clean"
          awk 'tolower($0) !~ /^[[:space:]]*extension[[:space:]]*=.*(swoole|curl)/' "$task_runtime_ini" > "$task_runtime_clean"
          mv "$task_runtime_clean" "$task_runtime_ini"
          if [[ -n "$task_curl_module" ]]; then
            printf 'extension=%s\n' "$task_curl_module" >> "$task_runtime_ini"
          fi
          printf 'extension=%s\n' "$task_swoole_module" >> "$task_runtime_ini"
          task_runtime_probe="$GITHUB_WORKSPACE/.cache/embed-runtime/8.5.10/probe"
          [[ "$(PHPRC="$task_runtime_ini" PHP_INI_SCAN_DIR="$task_control/php.d" "$task_runtime_probe")" == '1 1 1 1' ]]
          printf 'TYPE_CURL_MODULE=%s\nPHP_HOME=%s\nPHPX_HOME=%s\nTYPE_NATIVE_PHP_INI=%s\nPHPRC=%s\nPHP_INI_SCAN_DIR=%s\nCOMPOSER_BINARY=%s\n' \
            "$task_curl_module" "$PHP_HOME" "$PHPX_HOME" "$task_runtime_ini" "$task_control/php.ini" "$task_control/php.d" "$(command -v composer)" >> "$GITHUB_ENV"
      - name: 准备并核对内嵌管理前端
        if: inputs.tutorial_mode == ''
        uses: ./.github/actions/prepare-frontend
        with:
          artifact: ${{ inputs.frontend_artifact }}
      - name: 运行真实原生验收
        if: matrix.suite != 'single-program'
        env:
          TYPE_MACOS_SUITE: ${{ matrix.suite }}
        run: bash .github/scripts/run-macos-native.sh "$TYPE_MACOS_SUITE"
      - name: 静态 SDK 与所选数据库单程序验收
        if: matrix.suite == 'single-program'
        run: |
          set -euo pipefail
          brew install c-ares brotli flex
          task_bison="$(brew --prefix bison)"
          task_flex="$(brew --prefix flex)"
          export PATH="$task_bison/bin:$task_flex/bin:$PATH"
          export TYPE_STATIC_MINIMUM_MACOS=15.0
          mkdir -p build/static-macos-evidence
          export TYPE_STATIC_RUNTIME
          TYPE_STATIC_RUNTIME="$(bash tools/prepare-static-macos.sh "$GITHUB_WORKSPACE/build/static-macos-sdk" "$TYPEAPP_BUILD_PROFILE" 2>build/static-macos-evidence/sdk.log)"
          php tests/static-runtime-sdk.php "$TYPE_STATIC_RUNTIME" | tee build/static-macos-evidence/embed.log
          printf 'TYPE_STATIC_RUNTIME=%s\n' "$TYPE_STATIC_RUNTIME" >> "$GITHUB_ENV"
          if [[ -n "$TYPE_TUTORIAL_MODE" ]]; then exit 0; fi
          php tools/build-application.php >build/static-macos-evidence/application.log 2>&1
          php tests/release-candidate.php prepare
          TYPE_REDIS_SERVER="$(command -v redis-server)" php tests/release-candidate.php test "$TYPEAPP_BUILD_PROFILE" "$(brew --prefix mysql@8.4)" "$(brew --prefix postgresql@17)"
          php tests/release-candidate.php materials
          php tests/release-candidate.php service "$(brew --prefix mysql@8.4)" "$(brew --prefix postgresql@17)"
          php tests/release-candidate.php finish
      - name: 保存最终发布候选
        if: matrix.suite == 'single-program' && inputs.tutorial_mode == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-static-macos-arm64-${{ inputs.profile || 'sqlite' }}-${{ github.run_attempt }}
          path: build/release-candidate/attachments/*
          if-no-files-found: error
          retention-days: 90
      - name: 同 SDK 旧端与原静态候选的真实性能对照
        if: matrix.suite == 'single-program' && inputs.base_source != '' && inputs.tutorial_mode == ''
        run: |
          set -euo pipefail
          export TYPE_MYSQL_TOOLS TYPE_PGSQL_TOOLS
          TYPE_MYSQL_TOOLS="$(brew --prefix mysql@8.4)"
          TYPE_PGSQL_TOOLS="$(brew --prefix postgresql@17)"
          php tests/prepare-platform-benchmarks.php "$TYPE_BASE_SOURCE" "$(git rev-parse HEAD)" "$(command -v composer)" \
            --static-profile "$TYPEAPP_BUILD_PROFILE" | tee build/static-macos-evidence/benchmark-prepare.log
          task_pair="$(sed -n 's/^平台新旧基准准备完成：\(.*\)\/preparation.json$/\1/p' build/static-macos-evidence/benchmark-prepare.log)"
          test -n "$task_pair"
          php tests/benchmark-pairs.php "$task_pair/old" "$task_pair/new" --static-profile "$TYPEAPP_BUILD_PROFILE" \
            | tee build/static-macos-evidence/benchmark-pairs.log
          task_measure="$(sed -n 's/^成对正式测量完成：//p' build/static-macos-evidence/benchmark-pairs.log)"
          test -n "$task_measure"
          if php tests/benchmark-compare.php "$task_measure" | tee build/static-macos-evidence/benchmark-compare.log; then
            exit 0
          else
            task_comparison=("${PIPESTATUS[@]}")
          fi
          if [[ "${task_comparison[1]}" != 0 ]]; then exit "${task_comparison[1]}"; fi
          if [[ "${task_comparison[0]}" != 2 ]]; then exit "${task_comparison[0]}"; fi
          printf '正序出现回退信号；复用同一对程序交换顺序复测。\n' | tee build/static-macos-evidence/benchmark-status.log
          php tests/benchmark-pairs.php "$task_pair/old" "$task_pair/new" --static-profile "$TYPEAPP_BUILD_PROFILE" --order new-first \
            | tee build/static-macos-evidence/benchmark-pairs-reverse.log
          task_measure="$(sed -n 's/^成对正式测量完成：//p' build/static-macos-evidence/benchmark-pairs-reverse.log)"
          test -n "$task_measure"
          php tests/benchmark-compare.php "$task_measure" | tee build/static-macos-evidence/benchmark-compare-reverse.log
          printf '逆序未复现回退信号；两轮原始报告均保留，不据此宣称性能改善。\n' | tee -a build/static-macos-evidence/benchmark-status.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.tutorial_mode != ''
        with:
          node-version: '22.21.1'
      - name: 同一固定教程的独立编译与无源码部署
        if: inputs.tutorial_mode != ''
        run: |
          set -euo pipefail
          export TYPE_MYSQL_TOOLS TYPE_PGSQL_TOOLS TYPE_REDIS_SERVER NODE_BINARY OPENSSL_BINARY
          TYPE_MYSQL_TOOLS="$(brew --prefix mysql@8.4)"
          TYPE_PGSQL_TOOLS="$(brew --prefix postgresql@17)"
          TYPE_REDIS_SERVER="$(command -v redis-server)"
          NODE_BINARY="$(command -v node)"
          OPENSSL_BINARY="$TYPE_OPENSSL_BINARY"
          php tests/tutorial-delivery.php "$TYPE_TUTORIAL_MODE" "$TYPE_TUTORIAL_REFERENCE" \
            "--profile=$TYPEAPP_BUILD_PROFILE" "--runtime=$TYPE_STATIC_RUNTIME" "--output=$GITHUB_WORKSPACE/build/tutorial-delivery"
      - name: 保存教程同轮原始产物与证据
        if: inputs.tutorial_mode != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tutorial-${{ inputs.tutorial_mode }}-macos-arm64-${{ inputs.profile }}-${{ github.run_attempt }}
          path: build/tutorial-delivery/**
          if-no-files-found: error
          retention-days: 90
      - name: 保存构建与验证结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-${{ inputs.scope == 'single-program' && inputs.profile || 'all' }}-${{ matrix.suite }}${{ inputs.tutorial_mode != '' && format('-tutorial-{0}-{1}', inputs.tutorial_mode, github.run_attempt) || '' }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/static-macos-evidence/*
            build/static-benchmark-build.json
            build/pb-*/preparation.json
            build/pb-*/*/*.log
            build/pb-*/*/*.json
            build/pb-*/*/project/build/b/*.build.json
            build/pb-*/*/project/build/b/type-app
            build/pb-*/*/project/build/b/c/compile.log
            build/benchmark-pairs-*/*
            build/application-benchmark-*/**/*.json
            build/application-benchmark-*/**/*.log
            build/tutorial-delivery/**
            build/static-macos-sdk/sdk/manifest.json
            build/static-macos-sdk/adaptations.json
            build/static-macos-sdk/src/postgresql-17.11/config.log
            build/static-macos-sdk/src/php-8.5.10/config.log
            build/release-candidate/*.log
            build/release-candidate/*.json
            build/release-candidate/attachments/*
            build/**/verification.json
            build/scheduler-consumer-*.verification.json
            build/toolchain-regressions-*/**/*.log
            build/toolchain-regressions-*/**/*.failure
            build/toolchain-regressions-*/**/*evidence.json
            build/toolchain-regressions-*/**/execution.json
            build/toolchain-regressions-*/**/resources.json
            build/toolchain-regressions-*/**/resource-*
            build/toolchain-regressions-*/**/exit.json
            build/toolchain-regressions-*/**/stdout.json
            build/toolchain-regressions-*/**/type-app
            build/**/*.build.json
            build/**/profile.json
            build/**/compile.log
            build/native-database-*/*/*.log
            build/packaged-rollout-build-*/preparation.json
            build/packaged-rollout-build-*/old.log
            build/packaged-rollout-build-*/new.log
            build/packaged-rollout-*/scenario.log
            build/macos-recovery-ci-*/preparation.json
            build/platform-benchmarks-*/preparation.json
            build/platform-benchmarks-*/*/*.log
            build/benchmark-pairs-*/*.log
            build/benchmark-pairs-*/comparison-*.json
            build/native-*-tls-*/openssl.log
            build/native-*-tls-*/certificate-*.log
            build/native-*-tls-*/php.log
            build/native-*-tls-*/native.log

  macos-complete:
    name: macos-complete
    needs: native
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.native.result }}
        run: test "$MATRIX_RESULT" = success
