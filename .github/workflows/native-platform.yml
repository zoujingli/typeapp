name: Windows x64 原生验收

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      frontend_artifact:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      scope:
        description: 验收范围（http-probe 仅 IOCP、socket-probe 仅 TCP/UDP、tls-probe 仅 PHP 探针、tcp-handshake 仅握手 AOT；sqlite-app/pgsql-app 仅应用诊断；template 仅模板）
        type: choice
        options: [full, native, orm, template, pgsql-probe, pgsql-app, sqlite-app, http-probe, socket-probe, tls-probe, tcp-handshake]
        default: full
      orm_driver:
        description: 仅 scope=orm 生效；单库结果不代表三库验收
        type: choice
        options: [all, sqlite, mysql, pgsql]
        default: all
      tcp_with_echo:
        description: 仅 scope=tcp-handshake 生效；恢复并行普通回声以缩小完整套件挂起
        type: boolean
        default: false
      candidate_version:
        description: 可选vX.Y.Z或vX.Y.Z-rc.N；仅full范围验证最终候选，不分发或公开
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-platform-${{ github.ref }}${{ contains(fromJSON('["template","pgsql-app","sqlite-app","http-probe","socket-probe","tls-probe","tcp-handshake"]'), inputs.scope) && format('-{0}', inputs.scope) || '' }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'zoujingli/typeapp' && !contains(fromJSON('["http-probe","socket-probe","tls-probe","tcp-handshake"]'), inputs.scope)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TYPE_RELEASE_VERSION: ${{ inputs.version || inputs.candidate_version }}
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '1800'
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 核对手动候选验收范围
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_version != ''
        env:
          CANDIDATE_SCOPE: ${{ inputs.scope }}
        run: |
          if ($env:CANDIDATE_SCOPE -ne 'full' -or $env:TYPE_RELEASE_VERSION -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.[1-9][0-9]*)?\z') {
            throw '候选验收需要完整full范围和有效版本。'
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 准备已核验的 Windows x64 ZTS SDK
        run: ./.github/scripts/prepare-windows-native.ps1
      - name: 安装锁定开发与生产依赖
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" validate --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 准备并核对内嵌管理前端
        uses: ./.github/actions/prepare-frontend
        with:
          artifact: ${{ inputs.frontend_artifact }}
      - name: 定位受限 Windows 构建子进程
        run: |
          & "$env:PHP_HOME/php.exe" .github/scripts/probe-windows-process.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 新版工具链线程与 IOCP 协议原生回归
        if: inputs.scope == '' || inputs.scope == 'full' || inputs.scope == 'native'
        run: |
          $env:COMPOSER_BINARY="$env:PHP_HOME/composer.phar"
          & "$env:PHP_HOME/php.exe" tests/toolchain-native.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 检查 Windows 进程与平台行为
        if: inputs.scope != 'pgsql-probe' && inputs.scope != 'pgsql-app' && inputs.scope != 'sqlite-app'
        run: |
          foreach ($arguments in @(@('tests/windows-imports.php'), @('tests/windows-artifact-size.php'), @('tests/testing-portable.php'), @('tests/build-platform.php'), @('tests/helpers.php','--php'))) {
            & "$env:PHP_HOME/php.exe" @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 原生构建身份与缓存
        if: inputs.scope != 'orm' && inputs.scope != 'template' && inputs.scope != 'pgsql-probe' && inputs.scope != 'pgsql-app' && inputs.scope != 'sqlite-app'
        run: |
          # 直接从控制器 SDK 环境启动，先确认产物使用自己的配置；不依赖 ORM 步骤留下的状态。
          & "$env:PHP_HOME/php.exe" tests/build-platform-native.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 检查完整公开契约
        if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'native' && inputs.scope != 'template' && inputs.scope != 'pgsql-probe' && inputs.scope != 'pgsql-app' && inputs.scope != 'sqlite-app')
        run: |
          & "$env:PHP_HOME/php.exe" vendor/bin/phpunit --configuration phpunit.xml --log-junit build/windows-contracts.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 三库独立 ORM 与 Swoole 上下文验收
        if: inputs.scope != 'template' && inputs.scope != 'pgsql-probe' && inputs.scope != 'pgsql-app' && inputs.scope != 'sqlite-app'
        env:
          TYPE_ORM_DRIVER: ${{ inputs.scope == 'orm' && inputs.orm_driver || 'all' }}
        run: |
          # openssl 须先于 typephp_artifact 加载；完整应用产物会声明该必需依赖。
          $taskProfile = & "$env:PHP_HOME/php.exe" -r 'require "vendor/autoload.php"; $root=getcwd(); $p=(new Type\Build\RuntimeProfile())->prepare($root,$root."/build/windows-orm-runtime",getenv("PHP_HOME"),getenv("PHPX_HOME"),["openssl","pdo","pdo_mysql","pdo_pgsql","pdo_sqlite","sockets","swoole"]); echo $p["ini"];'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TYPE_NATIVE_PHP_INI=$taskProfile
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('TYPE_NATIVE_PHP_INI=' + $taskProfile) -Encoding utf8
          $env:TYPE_COMPOSER_PHAR="$env:PHP_HOME/composer.phar"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('TYPE_COMPOSER_PHAR=' + $env:TYPE_COMPOSER_PHAR) -Encoding utf8
          if ($env:TYPE_ORM_DRIVER -notin @('all', 'sqlite', 'mysql', 'pgsql')) { throw 'ORM 验收驱动无效。' }
          & "$env:PHP_HOME/php.exe" tests/build-scenario.php docs/build-config/type-read-write.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:TYPE_ORM_DRIVER -in @('all', 'sqlite')) {
            foreach ($taskMode in @('--php', '--native')) {
              & "$env:PHP_HOME/php.exe" tests/orm-suite-consumer.php sqlite $taskMode
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            foreach ($taskTarget in @('--php', 'build/read-write/type-app.exe')) {
              & "$env:PHP_HOME/php.exe" tests/read-write.php $taskTarget sqlite
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          foreach ($taskDriver in @('mysql', 'pgsql')) {
            if ($env:TYPE_ORM_DRIVER -in @('all', $taskDriver)) {
              ./.github/scripts/run-windows-database.ps1 -Driver $taskDriver -OrmOnly
            }
          }
      - name: PostgreSQL 原生接缝诊断
        if: inputs.scope == 'pgsql-probe'
        run: ./.github/scripts/run-windows-database.ps1 -Driver pgsql -OrmOnly -ProbeOnly
      - name: 四组件原生编译与 SQLite 行为
        if: inputs.scope != 'orm' && inputs.scope != 'template' && inputs.scope != 'pgsql-probe' && inputs.scope != 'pgsql-app' && inputs.scope != 'sqlite-app'
        run: |
          & "$env:PHP_HOME/php.exe" tests/helpers-build.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/embedded-resources.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 标准应用编译、SQLite与可搬迁发布
        if: inputs.scope != 'orm' && inputs.scope != 'template' && inputs.scope != 'pgsql-probe' && inputs.scope != 'pgsql-app' && inputs.scope != 'sqlite-app'
        run: |
          & "$env:PHP_HOME/php.exe" bin/typeapp-prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/iot-identity.php --php sqlite --app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tools/build-application.php --shared-development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/iot-identity.php build/app/type-app.exe sqlite --app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/native-package.php build/app/type-app.exe --archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TYPE_COMPOSER_PHAR="$env:PHP_HOME/composer.phar"
          & "$env:PHP_HOME/php.exe" tests/application-template.php sqlite --onboarding --native --package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 准备最终发布候选并验证SQLite部署
        if: env.TYPE_RELEASE_VERSION != ''
        run: |
          & "$env:PHP_HOME/php.exe" tests/release-candidate.php prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/release-candidate.php test sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 原生MySQL开发生产与完整模板接入
        if: inputs.scope != 'orm' && inputs.scope != 'template' && inputs.scope != 'pgsql-probe' && inputs.scope != 'pgsql-app' && inputs.scope != 'sqlite-app'
        run: ./.github/scripts/run-windows-database.ps1 -Driver mysql
      - name: 原生PostgreSQL开发生产与完整模板接入
        if: inputs.scope != 'orm' && inputs.scope != 'template' && inputs.scope != 'pgsql-probe' && inputs.scope != 'pgsql-app' && inputs.scope != 'sqlite-app'
        run: ./.github/scripts/run-windows-database.ps1 -Driver pgsql
      - name: 封存已通过三库的同一候选
        if: env.TYPE_RELEASE_VERSION != ''
        run: |
          & "$env:PHP_HOME/php.exe" tests/release-candidate.php finish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存最终发布候选
        if: env.TYPE_RELEASE_VERSION != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-windows-x64-${{ github.run_attempt }}
          path: build/release-candidate/attachments/*
          if-no-files-found: error
          retention-days: 90
      - name: 独立模板原生诊断
        if: inputs.scope == 'template'
        run: |
          $env:TYPE_COMPOSER_PHAR="$env:PHP_HOME/composer.phar"
          & "$env:PHP_HOME/php.exe" tests/application-template.php sqlite --onboarding --native --package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SQLite 应用开发诊断
        if: inputs.scope == 'sqlite-app'
        run: |
          & "$env:PHP_HOME/php.exe" bin/typeapp-prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($attempt in 1..5) {
            & "$env:PHP_HOME/php.exe" tests/iot-identity.php --php sqlite --app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: PostgreSQL 应用开发诊断
        if: inputs.scope == 'pgsql-app'
        run: |
          & "$env:PHP_HOME/php.exe" bin/typeapp-prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/run-windows-database.ps1 -Driver pgsql -DevelopmentOnly
      - name: 保存原生验收证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/release-candidate/*.log
            build/release-candidate/*.json
            build/release-candidate/attachments/*
            build/windows-contracts.xml
            build/**/verification.json
            build/toolchain-regressions-*/**/*.log
            build/toolchain-regressions-*/**/*.failure
            build/toolchain-regressions-*/**/*evidence.json
            build/toolchain-regressions-*/**/execution.json
            build/toolchain-regressions-*/**/resources.json
            build/toolchain-regressions-*/**/resource-*
            build/toolchain-regressions-*/**/exit.json
            build/toolchain-regressions-*/**/supervisor-*.json
            build/toolchain-regressions-*/**/stopped-*.json
            build/toolchain-regressions-*/**/stdout.json
            build/**/compile.log
            build/orm-suite-*/*.log
            build/orm-suite-*/behavior.json
            build/orm-suite-*/race.json
            build/orm-suite-*/increment.json
            build/orm-suite-*/release/**
            build/**/type-app.exe
            build/**/type-app.exe.build.json
            build/**/type-app.exe.resources/**
            build/windows-database-*/*.log
            build/iot-identity-*/*.log
            build/windows-runtime-*/*.log
            build/windows-runtime-*/*-source.json
            build/orm-suite-*/source-inputs.json
            build/orm-routing-evidence/*.json
            build/template-*/build/type-project.exe
            build/template-*/build/type-project.exe.build.json
            build/template-*/build/type-project.exe.resources/**
            build/template-*/build/compiler/runtime-profile/**
            build/template-*/build/compiler/compile.log

  socket-probe:
    if: github.repository == 'zoujingli/typeapp' && github.event_name == 'workflow_dispatch' && contains(fromJSON('["socket-probe","tls-probe","tcp-handshake"]'), inputs.scope) && inputs.candidate_version == ''
    name: socket-probe · ${{ matrix.protocol }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        protocol: ${{ fromJSON(inputs.scope == 'socket-probe' && '["tcp","udp"]' || '["tcp"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 准备已核验的 Windows x64 ZTS SDK
        run: ./.github/scripts/prepare-windows-native.ps1
      - name: 安装锁定工具链
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 快速核对指定 DNS 与线程重建
        if: matrix.protocol == 'tcp'
        run: |
          & "$env:PHP_HOME/php.exe" tests/swoole-dns.php (Join-Path $env:GITHUB_WORKSPACE 'build/toolchain-regressions-socket-probe/dns')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 运行独立通信消费者
        if: inputs.scope != 'tls-probe'
        env:
          SOCKET_PROTOCOL: ${{ matrix.protocol }}
          TCP_HANDSHAKE_ONLY: ${{ inputs.scope == 'tcp-handshake' }}
          TCP_WITH_ECHO: ${{ inputs.tcp_with_echo }}
        run: |
          $env:COMPOSER_BINARY="$env:PHP_HOME/composer.phar"
          $env:COMPOSER_DISABLE_NETWORK='1'
          $taskConsumer = Join-Path $env:GITHUB_WORKSPACE "build/toolchain-regressions-socket-probe/$env:SOCKET_PROTOCOL"
          $taskArguments = @("tests/$env:SOCKET_PROTOCOL-consumer.php", $taskConsumer)
          if ($env:TCP_HANDSHAKE_ONLY -eq 'true') { $taskArguments += '--handshake-only' }
          if ($env:TCP_HANDSHAKE_ONLY -eq 'true' -and $env:TCP_WITH_ECHO -eq 'true') { $taskArguments += '--with-echo' }
          & "$env:PHP_HOME/php.exe" @taskArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 核对原生 TLS 半关闭与握手截止
        if: always() && matrix.protocol == 'tcp'
        run: |
          & "$env:PHP_HOME/php.exe" tests/swoole-tls.php (Join-Path $env:GITHUB_WORKSPACE 'build/toolchain-regressions-socket-probe/tls')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 核对重复 TCP 监听与清理
        if: always() && matrix.protocol == 'tcp'
        run: |
          & "$env:PHP_HOME/php.exe" tests/tcp-binding.php (Join-Path $env:GITHUB_WORKSPACE 'build/toolchain-regressions-socket-probe/binding')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存原程序、对端和失败检查点
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-socket-probe-${{ matrix.protocol }}
          retention-days: 7
          path: |
            build/toolchain-regressions-socket-probe/**/*.log
            build/toolchain-regressions-socket-probe/**/*.failure
            build/toolchain-regressions-socket-probe/**/execution.json
            build/toolchain-regressions-socket-probe/**/verification.json
            build/toolchain-regressions-socket-probe/**/peer.json
            build/toolchain-regressions-socket-probe/**/dns.json
            build/toolchain-regressions-socket-probe/**/peers.json
            build/toolchain-regressions-socket-probe/**/certificate.pem
            build/toolchain-regressions-socket-probe/**/type-app.exe*
            build/windows-runtime-*/*.log
            build/windows-runtime-*/*.json

  http-probe:
    if: github.repository == 'zoujingli/typeapp' && github.event_name == 'workflow_dispatch' && inputs.scope == 'http-probe' && inputs.candidate_version == ''
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      TYPE_SWOOLE_BUILD_FROM_SOURCE: '1'
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 重建带官方 IOCP trace 的隔离模块
        run: ./.github/scripts/prepare-windows-native.ps1 -TraceLog
      - name: 安装锁定工具链
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 运行 HTTP 线程原生消费者
        run: |
          $env:COMPOSER_BINARY="$env:PHP_HOME/composer.phar"
          $env:COMPOSER_DISABLE_NETWORK='1'
          $env:TYPE_SWOOLE_MODULE="$env:PHP_HOME/ext/php_swoole.dll"
          $env:TYPEAPP_IOCP_TRACE='1'
          $taskConsumer = Join-Path $env:GITHUB_WORKSPACE 'build/toolchain-regressions-http-probe'
          & "$env:PHP_HOME/php.exe" tests/http-threads.php $taskConsumer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存原产物及 IOCP 诊断
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-http-probe
          retention-days: 7
          path: |
            build/toolchain-regressions-http-probe/**/*.log
            build/toolchain-regressions-http-probe/**/exit.json
            build/toolchain-regressions-http-probe/**/supervisor-*.json
            build/toolchain-regressions-http-probe/**/stopped-*.json
            build/toolchain-regressions-http-probe/http-thread-evidence.json
            build/toolchain-regressions-http-probe/build/native/type-app.exe*
            build/windows-runtime-*/*.log
            build/windows-runtime-*/*.json
