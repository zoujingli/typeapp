name: Windows x64 原生验收

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 验收范围（native 复用同一代码已通过的契约结果，仅复跑原生链路）
        type: choice
        options: [full, native]
        default: full
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'zoujingli/typeapp'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '1800'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 准备已核验的 Windows x64 ZTS SDK
        run: ./.github/scripts/prepare-windows-native.ps1
      - name: 安装锁定开发与生产依赖
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" validate --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 定位受限 Windows 构建子进程
        run: |
          & "$env:PHP_HOME/php.exe" .github/scripts/probe-windows-process.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 检查完整公开契约
        if: github.event_name != 'workflow_dispatch' || inputs.scope != 'native'
        run: |
          & "$env:PHP_HOME/php.exe" vendor/bin/phpunit --configuration phpunit.xml --log-junit build/windows-contracts.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 检查 Windows 进程与平台行为
        run: |
          foreach ($arguments in @(@('tests/windows-imports.php'), @('tests/testing-portable.php'), @('tests/build-platform.php'), @('tests/helpers.php','--php'))) {
            & "$env:PHP_HOME/php.exe" @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 原生构建身份与缓存
        run: |
          & "$env:PHP_HOME/php.exe" tests/build-platform-native.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 四组件原生编译与 SQLite 行为
        run: |
          & "$env:PHP_HOME/php.exe" tests/helpers-build.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 标准应用编译、SQLite与可搬迁发布
        run: |
          & "$env:PHP_HOME/php.exe" bin/typeapp-prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/iot-identity.php --php sqlite --app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" vendor/bin/type docs/build-config/type-app.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/iot-identity.php build/app/type-app.exe sqlite --app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/native-package.php build/app/type-app.exe --archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TYPE_COMPOSER_PHAR="$env:PHP_HOME/composer.phar"
          & "$env:PHP_HOME/php.exe" tests/application-template.php sqlite --onboarding --native --package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 原生MySQL开发生产与完整模板接入
        run: ./.github/scripts/run-windows-database.ps1 -Driver mysql
      - name: 原生PostgreSQL开发生产与完整模板接入
        run: ./.github/scripts/run-windows-database.ps1 -Driver pgsql
      - name: 保存原生验收证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/windows-contracts.xml
            build/**/verification.json
            build/**/compile.log
            build/**/type-app.exe
            build/**/type-app.exe.build.json
            build/**/type-app.exe.resources/**
            build/windows-database-*/*.log
