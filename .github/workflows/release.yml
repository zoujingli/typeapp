name: 版本构建与自动发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 已存在的vX.Y.Z或vX.Y.Z-rc.N；工作流ref也须选择该tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: typeapp-version-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      # 候选草稿仅向有仓库写权限的调用者列出，重试预检必须能识别已封存版本。
      contents: write
      actions: read
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      version: ${{ steps.resolve.outputs.version }}
      resume: ${{ steps.resolve.outputs.resume }}
      sealed: ${{ steps.resolve.outputs.sealed }}
      candidate_run: ${{ steps.resolve.outputs.candidate_run }}
      candidate_attempt: ${{ steps.resolve.outputs.candidate_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole
      - name: 核对重建材料完整性契约
        run: python3 tests/rebuild-materials.py
      - name: 核对版本、固定SHA、依赖与候选重试身份
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.TYPE_RELEASE_TOKEN != '' }}
        run: |
          if [[ "$RELEASE_TOKEN_CONFIGURED" != true ]]; then
            echo '缺少TYPE_RELEASE_TOKEN；请配置仅16个分发子仓Contents写权限的fine-grained PAT。' >&2
            exit 1
          fi
          php tools/release.php resolve "$VERSION"

  frontend:
    needs: resolve
    if: needs.resolve.outputs.resume == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.source }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole
      - uses: ./.github/actions/prepare-frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-frontend-${{ github.run_attempt }}
          path: |
            web/dist/**
            build/frontend/manifest.json
          if-no-files-found: error
          retention-days: 90

  linux-x64:
    needs: [resolve, frontend]
    if: needs.resolve.outputs.resume == 'false'
    uses: ./.github/workflows/native-command.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: release-frontend-${{ github.run_attempt }}
      version: ''

  linux-arm64:
    needs: [resolve, frontend]
    if: needs.resolve.outputs.resume == 'false'
    uses: ./.github/workflows/native-linux-arm64.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: release-frontend-${{ github.run_attempt }}
      version: ''

  macos-arm64:
    needs: [resolve, frontend]
    if: needs.resolve.outputs.resume == 'false'
    uses: ./.github/workflows/native-macos.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: release-frontend-${{ github.run_attempt }}
      version: ''

  linux-static:
    needs: [resolve, frontend]
    if: needs.resolve.outputs.resume == 'false'
    uses: ./.github/workflows/static-linux.yml
    strategy:
      fail-fast: false
      matrix:
        profile: [sqlite, mysql, pgsql]
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: release-frontend-${{ github.run_attempt }}
      version: ${{ needs.resolve.outputs.version }}
      profile: ${{ matrix.profile }}

  macos-static:
    needs: [resolve, frontend]
    if: needs.resolve.outputs.resume == 'false'
    uses: ./.github/workflows/native-macos.yml
    strategy:
      fail-fast: false
      matrix:
        profile: [sqlite, mysql, pgsql]
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: release-frontend-${{ github.run_attempt }}
      version: ${{ needs.resolve.outputs.version }}
      scope: single-program
      profile: ${{ matrix.profile }}

  windows-x64:
    needs: [resolve, frontend]
    if: needs.resolve.outputs.resume == 'false'
    uses: ./.github/workflows/native-platform.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: release-frontend-${{ github.run_attempt }}
      version: ''

  windows-static:
    needs: [resolve, frontend]
    if: needs.resolve.outputs.resume == 'false'
    uses: ./.github/workflows/static-windows-candidate.yml
    strategy:
      fail-fast: false
      matrix:
        profile: [sqlite, mysql, pgsql]
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: release-frontend-${{ github.run_attempt }}
      version: ${{ needs.resolve.outputs.version }}
      profile: ${{ matrix.profile }}

  release-native-complete:
    needs: [resolve, linux-x64, linux-arm64, macos-arm64, windows-x64, linux-static, macos-static, windows-static]
    if: always() && needs.resolve.outputs.resume == 'false'
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  tutorial-candidate:
    needs: resolve
    if: needs.resolve.outputs.resume == 'false'
    uses: ./.github/workflows/tutorial-delivery.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      version: ${{ needs.resolve.outputs.version }}
      mode: candidate
      reference: ${{ needs.resolve.outputs.source }}

  candidate:
    needs: [resolve, release-native-complete, tutorial-candidate]
    if: always() && needs.resolve.result == 'success' && (needs.resolve.outputs.resume == 'true' || (needs.release-native-complete.result == 'success' && needs.tutorial-candidate.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TYPE_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      TYPE_RELEASE_EVIDENCE_RUN: ${{ needs.resolve.outputs.candidate_run }}
      TYPE_RELEASE_EVIDENCE_ATTEMPT: ${{ needs.resolve.outputs.candidate_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.resolve.outputs.sealed != 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.candidate_run }}
          pattern: release-candidate-static-*-${{ needs.resolve.outputs.candidate_attempt }}
          merge-multiple: true
          path: build/release/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.resolve.outputs.sealed == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.candidate_run }}
          pattern: release-candidate-static-*-${{ needs.resolve.outputs.candidate_attempt }}
          merge-multiple: true
          path: build/release/rebuild-materials
      - if: needs.resolve.outputs.sealed == 'true'
        run: php tools/release.php restore "$TYPE_RELEASE_VERSION"
      - name: 恢复候选对应的重建材料
        if: needs.resolve.outputs.sealed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/release/assets
          mapfile -t materials < <(find build/release/rebuild-materials -type f -name 'typeapp-rebuild-*.zip' -print)
          test "${#materials[@]}" -eq 12
          for material in "${materials[@]}"; do
            cp -- "$material" build/release/assets/
          done
      - name: 读取原候选轮次的十二份教程原始证据
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.candidate_run }}
          pattern: tutorial-candidate-*-${{ needs.resolve.outputs.candidate_attempt }}
          merge-multiple: false
          path: build/release/tutorial-candidate/inputs
      - name: 回读原候选同源码同轮次教程矩阵
        env:
          TYPE_TUTORIAL_SOURCE: ${{ needs.resolve.outputs.source }}
        run: php tools/collect-tutorial.php candidate "$TYPE_TUTORIAL_SOURCE" build/release/tutorial-candidate "$TYPE_RELEASE_EVIDENCE_RUN" "$TYPE_RELEASE_EVIDENCE_ATTEMPT"
      - name: 保存候选草稿、附件及公开摘要
        env:
          TYPE_TUTORIAL_CANDIDATE_REPORT: ${{ github.workspace }}/build/release/tutorial-candidate/verification.json
        run: php tools/release.php candidate "$TYPE_RELEASE_VERSION"

  distribute:
    needs: [resolve, candidate]
    if: always() && needs.resolve.result == 'success' && needs.candidate.result == 'success'
    uses: ./.github/workflows/distribute-batch.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      mode: tag
      version: ${{ needs.resolve.outputs.version }}
      evidence_run: ${{ needs.resolve.outputs.candidate_run }}
      evidence_attempt: ${{ needs.resolve.outputs.candidate_attempt }}

  template:
    needs: [resolve, distribute]
    if: always() && needs.resolve.result == 'success' && needs.distribute.result == 'success'
    uses: ./.github/workflows/distribute-template.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      batch_run: ${{ github.run_id }}
      mode: tag
      version: ${{ needs.resolve.outputs.version }}
      evidence_run: ${{ needs.resolve.outputs.candidate_run }}
      evidence_attempt: ${{ needs.resolve.outputs.candidate_attempt }}

  tutorial-public:
    needs: [resolve, template]
    if: always() && needs.resolve.result == 'success' && needs.template.result == 'success'
    uses: ./.github/workflows/tutorial-delivery.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      version: ${{ needs.resolve.outputs.version }}
      mode: public
      reference: ${{ needs.resolve.outputs.version }}

  publish:
    needs: [resolve, template, tutorial-public]
    if: always() && needs.resolve.result == 'success' && needs.template.result == 'success' && needs.tutorial-public.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TYPE_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      TYPE_RELEASE_EVIDENCE_RUN: ${{ needs.resolve.outputs.candidate_run }}
      TYPE_RELEASE_EVIDENCE_ATTEMPT: ${{ needs.resolve.outputs.candidate_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: type-batch-result
          path: build/distribution
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: type-project-distribution
          path: build/release/template-evidence
      - run: cp build/release/template-evidence/distribution/template.json build/distribution/template.json
      - name: 读取本轮准确公开版本教程原始证据
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tutorial-public-*-${{ github.run_attempt }}
          merge-multiple: false
          path: build/release/tutorial-public/inputs
      - name: 回读公开版本同源码同轮次教程矩阵
        env:
          TYPE_TUTORIAL_SOURCE: ${{ needs.resolve.outputs.source }}
        run: php tools/collect-tutorial.php public "$TYPE_TUTORIAL_SOURCE" build/release/tutorial-public "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TYPE_RELEASE_VERSION"
      - name: 再核对16个Packagist版本及封存附件
        run: |
          php tools/release.php packagist "$TYPE_RELEASE_VERSION"
          php tools/release.php restore "$TYPE_RELEASE_VERSION"
          php tools/release.php verify-consumption "$TYPE_RELEASE_VERSION"
      - name: 公开16个子仓Release
        env:
          GH_TOKEN: ${{ secrets.TYPE_RELEASE_TOKEN }}
        run: php tools/release.php children "$TYPE_RELEASE_VERSION"
      - name: 最后公开主仓Release
        run: php tools/release.php publish "$TYPE_RELEASE_VERSION"
      - name: 保留逐项公开回执
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-receipts-${{ github.run_attempt }}
          path: |
            build/release/plan.json
            build/release/packagist.json
            build/release/consumption.json
            build/release/children.json
            build/release/published.json
            build/release/tutorial-public/verification.json
          retention-days: 90
