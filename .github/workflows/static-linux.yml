name: Linux 静态单程序验收

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: main 历史中的完整源码 SHA；留空使用本次事件提交
        required: false
        type: string
      version:
        description: 候选版本，仅验证不创建标签或发布
        required: true
        default: v0.0.0
        type: string
      profile:
        description: 数据库 profile
        required: true
        default: sqlite
        type: choice
        options: [sqlite, mysql, pgsql]
      base_source:
        description: 可选，同 SDK 框架性能对照的完整基准提交；只测量本轮原静态候选
        required: false
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      frontend_artifact:
        required: true
        type: string
      version:
        required: true
        type: string
      profile:
        required: true
        type: string
      base_source:
        default: ''
        type: string
      tutorial_mode:
        default: ''
        type: string
      tutorial_reference:
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: static-linux-${{ github.ref }}-${{ inputs.source_sha || github.sha }}-${{ inputs.profile || 'sqlite' }}-${{ inputs.tutorial_mode || 'iot' }}
  cancel-in-progress: false

jobs:
  frontend:
    if: inputs.frontend_artifact == '' && inputs.tutorial_mode == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 核对手动入口的固定 main 源码
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == zoujingli/typeapp && "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$(git rev-parse --verify "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          printf 'source=%s\n' "$SOURCE_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole
      - uses: ./.github/actions/prepare-frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-linux-frontend-${{ github.run_attempt }}
          path: |
            web/dist/**
            build/frontend/manifest.json
          if-no-files-found: error
          retention-days: 14

  static:
    needs: frontend
    if: ${{ !cancelled() && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    name: ${{ inputs.profile || 'sqlite' }} · ${{ inputs.tutorial_mode != '' && '教程单程序' || '静态单程序' }} · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      TYPE_RELEASE_VERSION: ${{ inputs.version }}
      TYPEAPP_BUILD_PROFILE: ${{ inputs.profile || 'sqlite' }}
      TYPE_BASE_SOURCE: ${{ inputs.base_source }}
      TYPE_BENCHMARK_BUILD_TIMING: ${{ inputs.base_source != '' && inputs.tutorial_mode == '' && '1' || '0' }}
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '1800'
      TYPE_TUTORIAL_MODE: ${{ inputs.tutorial_mode }}
      TYPE_TUTORIAL_REFERENCE: ${{ inputs.tutorial_reference }}
      TYPEAPP_BUILD_CONFIGURATION: ${{ inputs.tutorial_mode != '' && format('{0}/examples/catalog/build-profiles.json', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 核对手动入口的固定 main 源码
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == zoujingli/typeapp && "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$(git rev-parse --verify "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          printf 'source=%s\n' "$SOURCE_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          coverage: none
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            .cache/php-sdk/8.5.10-zts
            .cache/php-sdk-build/8.5.10-zts
          key: locked-php-8.5.10-zts-${{ runner.os }}-${{ runner.arch }}-v6
      - name: 准备锁定宿主与原生静态依赖
        run: |
          set -euo pipefail
          [[ "$TYPE_RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          mkdir -p build/static-linux-evidence
          # 宿主缓存命中也须安装开发依赖；静态归档不属于 PHP SDK 缓存。
          # 重建材料必须保留与已安装静态库同版本的发行版源码及补丁。
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake pkg-config autoconf bison re2c flex libgmp-dev libmpfr-dev libbrotli-dev libicu-dev libnghttp2-dev libc-ares-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev libpq-dev libonig-dev libzip-dev zlib1g-dev bubblewrap mysql-server mysql-client postgresql redis-server
          task_host="$(bash tools/install-locked-linux-php.sh 2>build/static-linux-evidence/host.log)"
          printf '%s/bin\n' "$task_host" >> "$GITHUB_PATH"
          printf 'PHP_HOME=%s\n' "$task_host" >> "$GITHUB_ENV"
          sudo systemctl stop mysql postgresql redis-server
          for task_service in mysql postgresql redis-server; do
            if systemctl is-active --quiet "$task_service"; then exit 1; fi
          done
          task_mysql="$GITHUB_WORKSPACE/build/static-linux-mysql"
          mkdir -p "$task_mysql/bin"
          cp -L "$(command -v mysqld)" "$task_mysql/bin/mysqld"
          for task_program in mysql mysqldump; do ln -s "$(command -v "$task_program")" "$task_mysql/bin/$task_program"; done
          ln -s /usr/share "$task_mysql/share"
          printf 'TYPE_MYSQL_TOOLS=%s\nTYPE_PGSQL_TOOLS=%s\nTYPE_BWRAP_BINARY=%s\n' \
            "$task_mysql" "$(dirname "$(pg_config --bindir)")" "$(command -v bwrap)" >> "$GITHUB_ENV"
          task_redis="$GITHUB_WORKSPACE/build/static-linux-redis/redis-server"
          mkdir -p "$(dirname "$task_redis")"
          # Debian 的 redis-server 链接到多调用文件；保持 argv[0] 的服务器名称。
          # 与常规 ARM64 原生验收使用同一准备方式，避免 realpath 选择 RDB 检查器。
          cp -L "$(command -v redis-server)" "$task_redis"
          printf 'TYPE_REDIS_SERVER=%s\n' "$task_redis" >> "$GITHUB_ENV"
      - name: 安装锁定源码并准备构建宿主
        run: |
          set -euo pipefail
          composer install --no-scripts --no-plugins --prefer-dist --no-progress --ignore-platform-req=ext-swoole
          export PHPX_HOME="$GITHUB_WORKSPACE/build/static-linux-host-phpx"
          cp -R vendor/swoole/phpx "$PHPX_HOME"
          bash tools/prepare-toolchain.sh >build/static-linux-evidence/phpx-host.log 2>&1
          task_module="$(bash tools/prepare-swoole-module.sh)"
          task_control="$GITHUB_WORKSPACE/build/static-linux-control"
          mkdir -p "$task_control/php.d"
          printf 'memory_limit=2G\ndisplay_errors=1\nextension=%s\nextension=%s\nextension=%s\n' \
            "$(php-config --extension-dir)/curl.so" "$(php-config --extension-dir)/redis.so" "$task_module" > "$task_control/php.ini"
          printf 'PHPX_HOME=%s\nPHPRC=%s/php.ini\nPHP_INI_SCAN_DIR=%s/php.d\nTYPE_SWOOLE_MODULE=%s\n' \
            "$PHPX_HOME" "$task_control" "$task_control" "$task_module" >> "$GITHUB_ENV"
      - name: 制备静态目标 SDK 并执行真实 embed 探针
        run: |
          set -euo pipefail
          task_manifest="$(bash tools/prepare-static-linux.sh "$GITHUB_WORKSPACE/build/static-linux-sdk" "$TYPEAPP_BUILD_PROFILE" 2>build/static-linux-evidence/sdk.log)"
          php tests/static-runtime-sdk.php "$task_manifest" | tee build/static-linux-evidence/embed.log
          printf 'TYPE_STATIC_RUNTIME=%s\n' "$task_manifest" >> "$GITHUB_ENV"
      - name: 准备并核对内嵌管理前端
        if: inputs.tutorial_mode == ''
        uses: ./.github/actions/prepare-frontend
        with:
          artifact: ${{ inputs.frontend_artifact || format('static-linux-frontend-{0}', github.run_attempt) }}
      - name: 完整应用 AOT 与所选数据库单程序验收
        if: inputs.tutorial_mode == ''
        run: |
          set -euo pipefail
          php tools/build-application.php >build/static-linux-evidence/application.log 2>&1
          php tests/release-candidate.php prepare
          php tests/release-candidate.php test "$TYPEAPP_BUILD_PROFILE" "$TYPE_MYSQL_TOOLS" "$TYPE_PGSQL_TOOLS"
          php tests/release-candidate.php materials
      - name: 同一单程序的 systemd 生命周期
        if: inputs.tutorial_mode == ''
        env:
          TYPE_SERVICE_ARTIFACT: ${{ github.workspace }}/build/app/type-app
        run: |
          php tests/release-candidate.php service "$TYPE_MYSQL_TOOLS" "$TYPE_PGSQL_TOOLS"
          php tests/release-candidate.php finish
      - name: 保存最终单程序候选
        if: inputs.tutorial_mode == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # 发布候选只下载这一类静态 profile artifact；前置的常规原生验收
          # 仍可能上传同名旧协议材料，不能让发布候选的通配符误把它们混入。
          name: release-candidate-static-${{ matrix.platform }}-${{ inputs.profile || 'sqlite' }}-${{ github.run_attempt }}
          path: build/release-candidate/attachments/*
          if-no-files-found: error
          retention-days: 90
      - name: 同 SDK 旧端与原静态候选的真实性能对照
        if: inputs.base_source != '' && inputs.tutorial_mode == ''
        run: |
          set -euo pipefail
          php tests/prepare-platform-benchmarks.php "$TYPE_BASE_SOURCE" "$(git rev-parse HEAD)" "$(command -v composer)" \
            --static-profile "$TYPEAPP_BUILD_PROFILE" | tee build/static-linux-evidence/benchmark-prepare.log
          task_pair="$(sed -n 's/^平台新旧基准准备完成：\(.*\)\/preparation.json$/\1/p' build/static-linux-evidence/benchmark-prepare.log)"
          test -n "$task_pair"
          php tests/benchmark-pairs.php "$task_pair/old" "$task_pair/new" --static-profile "$TYPEAPP_BUILD_PROFILE" \
            | tee build/static-linux-evidence/benchmark-pairs.log
          task_measure="$(sed -n 's/^成对正式测量完成：//p' build/static-linux-evidence/benchmark-pairs.log)"
          test -n "$task_measure"
          if php tests/benchmark-compare.php "$task_measure" | tee build/static-linux-evidence/benchmark-compare.log; then
            exit 0
          else
            task_comparison=("${PIPESTATUS[@]}")
          fi
          if [[ "${task_comparison[1]}" != 0 ]]; then exit "${task_comparison[1]}"; fi
          if [[ "${task_comparison[0]}" != 2 ]]; then exit "${task_comparison[0]}"; fi
          printf '正序出现回退信号；复用同一对程序交换顺序复测。\n' | tee build/static-linux-evidence/benchmark-status.log
          php tests/benchmark-pairs.php "$task_pair/old" "$task_pair/new" --static-profile "$TYPEAPP_BUILD_PROFILE" --order new-first \
            | tee build/static-linux-evidence/benchmark-pairs-reverse.log
          task_measure="$(sed -n 's/^成对正式测量完成：//p' build/static-linux-evidence/benchmark-pairs-reverse.log)"
          test -n "$task_measure"
          php tests/benchmark-compare.php "$task_measure" | tee build/static-linux-evidence/benchmark-compare-reverse.log
          printf '逆序未复现回退信号；两轮原始报告均保留，不据此宣称性能改善。\n' | tee -a build/static-linux-evidence/benchmark-status.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.tutorial_mode != ''
        with:
          node-version: '22.21.1'
      - name: 同一固定教程的独立编译与无源码部署
        if: inputs.tutorial_mode != ''
        run: |
          set -euo pipefail
          export NODE_BINARY OPENSSL_BINARY
          NODE_BINARY="$(command -v node)"
          OPENSSL_BINARY="$(command -v openssl)"
          php tests/tutorial-delivery.php "$TYPE_TUTORIAL_MODE" "$TYPE_TUTORIAL_REFERENCE" \
            "--profile=$TYPEAPP_BUILD_PROFILE" "--runtime=$TYPE_STATIC_RUNTIME" "--output=$GITHUB_WORKSPACE/build/tutorial-delivery"
      - name: 保存教程同轮原始产物与证据
        if: inputs.tutorial_mode != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tutorial-${{ inputs.tutorial_mode }}-${{ matrix.platform }}-${{ inputs.profile }}-${{ github.run_attempt }}
          path: build/tutorial-delivery/**
          if-no-files-found: error
          retention-days: 90
      - name: 保存构建与验收证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-${{ matrix.platform }}-${{ inputs.profile || 'sqlite' }}-evidence${{ inputs.tutorial_mode != '' && format('-tutorial-{0}-{1}', inputs.tutorial_mode, github.run_attempt) || '' }}
          retention-days: 14
          path: |
            build/static-linux-evidence/*
            build/static-benchmark-build.json
            build/pb-*/preparation.json
            build/pb-*/*/*.log
            build/pb-*/*/*.json
            build/pb-*/*/project/build/b/*.build.json
            build/pb-*/*/project/build/b/type-app
            build/pb-*/*/project/build/b/c/compile.log
            build/benchmark-pairs-*/*
            build/application-benchmark-*/**/*.json
            build/application-benchmark-*/**/*.log
            build/release-candidate/attachments/*.json
            build/tutorial-delivery/**
            build/static-linux-sdk/sdk/manifest.json
            build/static-linux-sdk/adaptations.json
            build/static-sdk-probe-*/verification.json
            build/app/*.build.json
            build/app/compiler/compile.log
            build/release-candidate/*.json
            build/release-candidate/*.log
            build/single program-*/verification.json
            build/iot-identity-*/verification.json
            build/iot-identity-*/http.log
            build/broker-access-*/verification.json
            build/broker-access-*/node-stop.log
            build/broker-access-*/*-cleanup.log
            build/service-linux-ci-*/verification.json
            build/service-linux-ci-*/preparation.json
      - name: 保存失败时的原始程序
        if: failure() && inputs.tutorial_mode == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-${{ matrix.platform }}-${{ inputs.profile || 'sqlite' }}-failed-program
          retention-days: 14
          path: build/app/type-app
          if-no-files-found: warn
