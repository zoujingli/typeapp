name: Linux 静态单程序验收

on:
  workflow_dispatch:
    inputs:
      version:
        description: 候选版本，仅验证不创建标签或发布
        required: true
        default: v1.0.0-rc.8
        type: string
      profile:
        description: 数据库 profile
        required: true
        default: sqlite
        type: choice
        options: [sqlite, mysql, pgsql]
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      frontend_artifact:
        required: true
        type: string
      version:
        required: true
        type: string
      profile:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: static-linux-${{ github.ref }}-${{ inputs.profile || 'sqlite' }}
  cancel-in-progress: false

jobs:
  frontend:
    if: inputs.frontend_artifact == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-swoole
      - uses: ./.github/actions/prepare-frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-linux-frontend-${{ github.run_attempt }}
          path: |
            web/dist/**
            build/frontend/manifest.json
          if-no-files-found: error
          retention-days: 14

  static:
    needs: frontend
    if: ${{ !cancelled() && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    name: ${{ inputs.profile || 'sqlite' }} · 静态单程序 · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      TYPE_RELEASE_VERSION: ${{ inputs.version }}
      TYPEAPP_BUILD_PROFILE: ${{ inputs.profile || 'sqlite' }}
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '1800'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          coverage: none
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            .cache/php-sdk/8.5.10-zts
            .cache/php-sdk-build/8.5.10-zts
          key: locked-php-8.5.10-zts-${{ runner.os }}-${{ runner.arch }}-v6
      - name: 准备锁定宿主与原生静态依赖
        run: |
          set -euo pipefail
          [[ "$TYPE_RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          mkdir -p build/static-linux-evidence
          # 宿主缓存命中也须安装开发依赖；静态归档不属于 PHP SDK 缓存。
          # 重建材料必须保留与已安装静态库同版本的发行版源码及补丁。
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake pkg-config autoconf bison re2c flex libgmp-dev libmpfr-dev libbrotli-dev libicu-dev libnghttp2-dev libc-ares-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev libpq-dev libonig-dev libzip-dev zlib1g-dev bubblewrap mysql-server mysql-client postgresql redis-server
          task_host="$(bash tools/install-locked-linux-php.sh 2>build/static-linux-evidence/host.log)"
          printf '%s/bin\n' "$task_host" >> "$GITHUB_PATH"
          printf 'PHP_HOME=%s\n' "$task_host" >> "$GITHUB_ENV"
          sudo systemctl stop mysql postgresql redis-server
          for task_service in mysql postgresql redis-server; do
            if systemctl is-active --quiet "$task_service"; then exit 1; fi
          done
          task_mysql="$GITHUB_WORKSPACE/build/static-linux-mysql"
          mkdir -p "$task_mysql/bin"
          cp -L "$(command -v mysqld)" "$task_mysql/bin/mysqld"
          for task_program in mysql mysqldump; do ln -s "$(command -v "$task_program")" "$task_mysql/bin/$task_program"; done
          ln -s /usr/share "$task_mysql/share"
          printf 'TYPE_MYSQL_TOOLS=%s\nTYPE_PGSQL_TOOLS=%s\nTYPE_BWRAP_BINARY=%s\n' \
            "$task_mysql" "$(dirname "$(pg_config --bindir)")" "$(command -v bwrap)" >> "$GITHUB_ENV"
          task_redis="$GITHUB_WORKSPACE/build/static-linux-redis/redis-server"
          mkdir -p "$(dirname "$task_redis")"
          # Debian 的 redis-server 链接到多调用文件；保持 argv[0] 的服务器名称。
          # 与常规 ARM64 原生验收使用同一准备方式，避免 realpath 选择 RDB 检查器。
          cp -L "$(command -v redis-server)" "$task_redis"
          printf 'TYPE_REDIS_SERVER=%s\n' "$task_redis" >> "$GITHUB_ENV"
      - name: 安装锁定源码并准备构建宿主
        run: |
          set -euo pipefail
          composer install --no-scripts --no-plugins --prefer-dist --no-progress --ignore-platform-req=ext-swoole
          export PHPX_HOME="$GITHUB_WORKSPACE/build/static-linux-host-phpx"
          cp -R vendor/swoole/phpx "$PHPX_HOME"
          bash tools/prepare-toolchain.sh >build/static-linux-evidence/phpx-host.log 2>&1
          task_module="$(bash tools/prepare-swoole-module.sh)"
          task_control="$GITHUB_WORKSPACE/build/static-linux-control"
          mkdir -p "$task_control/php.d"
          printf 'memory_limit=2G\ndisplay_errors=1\nextension=%s\nextension=%s\nextension=%s\n' \
            "$(php-config --extension-dir)/curl.so" "$(php-config --extension-dir)/redis.so" "$task_module" > "$task_control/php.ini"
          printf 'PHPX_HOME=%s\nPHPRC=%s/php.ini\nPHP_INI_SCAN_DIR=%s/php.d\nTYPE_SWOOLE_MODULE=%s\n' \
            "$PHPX_HOME" "$task_control" "$task_control" "$task_module" >> "$GITHUB_ENV"
      - name: 制备静态目标 SDK 并执行真实 embed 探针
        run: |
          set -euo pipefail
          task_manifest="$(bash tools/prepare-static-linux.sh "$GITHUB_WORKSPACE/build/static-linux-sdk" "$TYPEAPP_BUILD_PROFILE" 2>build/static-linux-evidence/sdk.log)"
          php tests/static-runtime-sdk.php "$task_manifest" | tee build/static-linux-evidence/embed.log
          printf 'TYPE_STATIC_RUNTIME=%s\n' "$task_manifest" >> "$GITHUB_ENV"
      - name: 准备并核对内嵌管理前端
        uses: ./.github/actions/prepare-frontend
        with:
          artifact: ${{ inputs.frontend_artifact || format('static-linux-frontend-{0}', github.run_attempt) }}
      - name: 完整应用 AOT 与所选数据库单程序验收
        run: |
          set -euo pipefail
          php tools/build-application.php >build/static-linux-evidence/application.log 2>&1
          php tests/release-candidate.php prepare
          php tests/release-candidate.php test "$TYPEAPP_BUILD_PROFILE" "$TYPE_MYSQL_TOOLS" "$TYPE_PGSQL_TOOLS"
          php tests/release-candidate.php materials
      - name: 同一单程序的 systemd 生命周期
        env:
          TYPE_SERVICE_ARTIFACT: ${{ github.workspace }}/build/app/type-app
        run: |
          php tests/release-candidate.php service "$TYPE_MYSQL_TOOLS" "$TYPE_PGSQL_TOOLS"
          php tests/release-candidate.php finish
      - name: 保存最终单程序候选
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # 发布候选只下载这一类静态 profile artifact；前置的常规原生验收
          # 仍可能上传同名旧协议材料，不能让发布候选的通配符误把它们混入。
          name: release-candidate-static-${{ matrix.platform }}-${{ inputs.profile || 'sqlite' }}-${{ github.run_attempt }}
          path: build/release-candidate/attachments/*
          if-no-files-found: error
          retention-days: 90
      - name: 保存构建与验收证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-${{ matrix.platform }}-${{ inputs.profile || 'sqlite' }}-evidence
          retention-days: 14
          path: |
            build/static-linux-evidence/*
            build/static-linux-sdk/sdk/manifest.json
            build/static-linux-sdk/adaptations.json
            build/static-sdk-probe-*/verification.json
            build/app/*.build.json
            build/app/compiler/compile.log
            build/release-candidate/*.json
            build/release-candidate/*.log
            build/single program-*/verification.json
            build/iot-identity-*/verification.json
            build/broker-access-*/verification.json
            build/service-linux-ci-*/verification.json
            build/service-linux-ci-*/preparation.json
      - name: 保存失败时的原始程序
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-${{ matrix.platform }}-${{ inputs.profile || 'sqlite' }}-failed-program
          retention-days: 14
          path: build/app/type-app
          if-no-files-found: warn
