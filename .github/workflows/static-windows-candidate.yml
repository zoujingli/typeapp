name: Windows 静态单程序验收

on:
  workflow_dispatch:
    inputs:
      version:
        description: 候选版本，仅验证不创建标签或发布
        required: true
        default: v1.0.0-rc.8
        type: string
      sdk_run:
        description: 可选，只读复用已通过探针的本仓SDK运行编号；应用仍重新全量编译验收
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      frontend_artifact:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: static-windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk:
    if: inputs.sdk_run == ''
    uses: ./.github/workflows/static-windows.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      scope: phpx

  application:
    needs: sdk
    if: ${{ !cancelled() && (needs.sdk.result == 'success' || (needs.sdk.result == 'skipped' && inputs.sdk_run != '')) }}
    name: Windows x64 单程序三库
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '1800'
      TYPE_RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 核对候选版本
        run: |
          if ($env:TYPE_RELEASE_VERSION -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$') {
            throw '候选版本必须为明确 SemVer。'
          }
          New-Item -ItemType Directory -Path build/static-windows-application-evidence | Out-Null
      - name: 核对诊断复用来源
        if: inputs.sdk_run != ''
        env:
          SDK_RUN: ${{ inputs.sdk_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:SDK_RUN -cnotmatch '^[1-9][0-9]*$') { throw 'SDK 运行编号无效。' }
          $taskRun = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SDK_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $taskRun.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
              $taskRun.path -cnotin @('.github/workflows/static-windows.yml', '.github/workflows/static-windows-candidate.yml')) {
            throw '只能复用本仓静态 SDK 制备入口的产物。'
          }
          @{sdk_run=$taskRun.id; sdk_source=$taskRun.head_sha; application_source=$env:GITHUB_SHA; scope='diagnostic only'} |
            ConvertTo-Json | Set-Content build/static-windows-application-evidence/inputs.json -Encoding utf8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-windows-sdk
          path: build/static-windows-sdk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.sdk_run || github.run_id }}
      - name: 准备锁定构建宿主
        run: ./.github/scripts/prepare-windows-native.ps1
      - name: 安装锁定源码并核对静态 SDK
        run: |
          & "$env:PHP_HOME/php.exe" "$env:PHP_HOME/composer.phar" install --no-scripts --no-plugins --prefer-dist --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskManifest = Join-Path $env:GITHUB_WORKSPACE 'build/static-windows-sdk/manifest.json'
          & "$env:PHP_HOME/php.exe" tests/static-runtime-sdk.php $taskManifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 复用也核对制备脚本；SDK 的 ABI、归档、头文件及源码适配由上方真实探针验证。
          $taskSdk = Get-Content -LiteralPath $taskManifest -Raw | ConvertFrom-Json
          if (@($taskSdk.preparation.scripts.PSObject.Properties).Count -ne 5 -or
              $taskSdk.preparation.'dependency-manifest-sha256' -cne (Get-FileHash tools/static-windows/vcpkg.json -Algorithm SHA256).Hash.ToLowerInvariant() -or
              $taskSdk.preparation.'dependency-triplet-sha256' -cne (Get-FileHash tools/static-windows/x64-typeapp-static.cmake -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw '静态 SDK 制备身份不完整或依赖声明已变化。'
          }
          foreach ($taskScript in $taskSdk.preparation.scripts.PSObject.Properties) {
            if ($taskScript.Name -cnotmatch '^tools/(probe-static-windows\.ps1|static-windows/(build-phpx\.ps1|phpx/CMakeLists\.txt|prepare-extensions\.php|export-sdk\.php))$' -or
                (Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $taskScript.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $taskScript.Value) {
              throw '静态 SDK 制备脚本已变化，必须重新构建SDK。'
            }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('TYPE_STATIC_RUNTIME=' + $taskManifest) -Encoding utf8
      - name: 准备同一版本的内嵌前端
        uses: ./.github/actions/prepare-frontend
        with:
          artifact: ${{ inputs.frontend_artifact }}
      - name: 全量 AOT 并封存最终 EXE
        run: |
          & "$env:PHP_HOME/php.exe" tools/build-application.php 2>&1 |
            Tee-Object build/static-windows-application-evidence/application.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PHP_HOME/php.exe" tests/release-candidate.php prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 同一 EXE 的 SQLite 无源码部署
        run: |
          & "$env:PHP_HOME/php.exe" tests/release-candidate.php test sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 同一 EXE 的 MySQL 无源码部署
        run: ./.github/scripts/run-windows-database.ps1 -Driver mysql -SingleProgram
      - name: 同一 EXE 的 PostgreSQL 无源码部署
        run: ./.github/scripts/run-windows-database.ps1 -Driver pgsql -SingleProgram
      - name: 读取本轮依赖来源材料
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-windows-dependencies
          path: build/static-windows-dependency-inputs
          github-token: ${{ github.token }}
          run-id: ${{ inputs.sdk_run || github.run_id }}
      - name: 封存对应源码与重建材料
        env:
          TYPE_REBUILD_DEPENDENCIES: ${{ github.workspace }}/build/static-windows-dependency-inputs/x64-typeapp-static
        run: |
          & "$env:PHP_HOME/php.exe" tests/release-candidate.php materials
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 核对三库结果与待发布文件身份
        run: |
          & "$env:PHP_HOME/php.exe" tests/release-candidate.php finish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存最终单程序候选
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-windows-x64-${{ github.run_attempt }}
          path: build/release-candidate/attachments/*
          if-no-files-found: error
          retention-days: 90
      - name: 保存构建与部署证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-windows-application-evidence
          retention-days: 14
          path: |
            build/static-windows-application-evidence/*
            build/static-windows-sdk/manifest.json
            build/static-sdk-probe-*/verification.json
            build/app/*.build.json
            build/app/type-app.exe
            build/app/compiler/compile.log
            build/release-candidate/*.json
            build/release-candidate/*.log
            build/single program-*/verification.json
            build/windows-database-*/*
