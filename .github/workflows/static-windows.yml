name: Windows 静态运行库实验

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 验证核心、依赖、扩展或 PHPX 静态嵌入；均不生成应用候选
        type: choice
        options: [core, dependencies, runtime, phpx]
        default: core

permissions:
  contents: read

concurrency:
  group: static-windows-${{ github.ref }}-${{ inputs.scope || 'core' }}
  cancel-in-progress: false

jobs:
  core:
    if: inputs.scope == 'core'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 构建静态 PHP 核心并审计独立 embed
        timeout-minutes: 12
        shell: pwsh
        run: ./tools/probe-static-windows.ps1 -Directory "$env:GITHUB_WORKSPACE/build/static-windows-core"
      - name: 保存实际编译、导入与运行结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-windows-core-evidence
          retention-days: 14
          if-no-files-found: error
          path: build/static-windows-core/evidence/*

  dependencies:
    if: inputs.scope != 'core'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/static-windows-vcpkg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 恢复固定静态依赖的编译缓存
        id: dependency-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .cache/static-windows-vcpkg
          key: static-windows-vcpkg-${{ hashFiles('tools/static-windows/vcpkg.json', 'tools/static-windows/x64-typeapp-static.cmake') }}-v1
          restore-keys: static-windows-vcpkg-
      - name: 制备静态第三方库并运行 PE 探针
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          ./tools/prepare-static-windows-dependencies.ps1 -Directory "$env:GITHUB_WORKSPACE/build/static-windows-dependencies"
      - name: 保存已编译归档以便探针修复后复用
        if: always() && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .cache/static-windows-vcpkg
          key: static-windows-vcpkg-${{ hashFiles('tools/static-windows/vcpkg.json', 'tools/static-windows/x64-typeapp-static.cmake') }}-v1
      - name: 保存原始构建与真实运行结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-windows-dependencies-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/static-windows-dependencies/evidence/*
            build/static-windows-dependencies/vcpkg/buildtrees/**/*.log
            build/static-windows-dependencies/installed/vcpkg/status
      - name: 保存本轮依赖供后续完整 SDK 构建复用
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-windows-dependencies
          retention-days: 14
          if-no-files-found: error
          path: build/static-windows-dependencies/installed/**

  runtime:
    if: inputs.scope == 'runtime' || inputs.scope == 'phpx'
    needs: dependencies
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-windows-dependencies
          path: build/runtime-dependencies
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-windows-dependencies-evidence
          path: build/runtime-dependency-evidence
      - name: 构建 PHP 与完整静态扩展并验证独立 embed
        timeout-minutes: 35
        shell: pwsh
        env:
          TYPE_STATIC_PHPX_PROBE: ${{ inputs.scope == 'phpx' && '1' || '0' }}
        run: |
          ./tools/probe-static-windows.ps1 -Directory "$env:GITHUB_WORKSPACE/build/static-windows-runtime" `
            -DependenciesDirectory "$env:GITHUB_WORKSPACE/build/runtime-dependencies/x64-typeapp-static" `
            -DependencyVerification "$env:GITHUB_WORKSPACE/build/runtime-dependency-evidence/evidence/verification.json" `
            -WithPhpx:($env:TYPE_STATIC_PHPX_PROBE -eq '1')
      - name: 保存扩展的构建、导入和启动原始证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-windows-runtime-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/static-windows-runtime/evidence/*
            build/static-windows-runtime/phpx-static/evidence/*
