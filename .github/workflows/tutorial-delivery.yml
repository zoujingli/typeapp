name: 教程四平台单程序交付

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: main 已包含的完整源码 SHA，仅验收候选，不创建标签或发布
        required: true
        type: string
      platform:
        description: 验收平台；定向检查不能替代发布完整矩阵
        required: true
        default: all
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, windows-x64]
      profile:
        description: 数据库 profile；发布始终验收全部三个
        required: true
        default: all
        type: choice
        options: [all, sqlite, mysql, pgsql]
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      mode:
        required: true
        type: string
      reference:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
      mode: ${{ steps.identity.outputs.mode }}
      reference: ${{ steps.identity.outputs.reference }}
      platform: ${{ steps.identity.outputs.platform }}
      profile: ${{ steps.identity.outputs.profile }}
      profiles: ${{ steps.identity.outputs.profiles }}
      full: ${{ steps.identity.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          SOURCE: ${{ inputs.source_sha }}
          MODE: ${{ inputs.mode || 'candidate' }}
          VERSION: ${{ inputs.version || 'v0.0.0' }}
          REFERENCE: ${{ inputs.mode == '' && inputs.source_sha || inputs.reference }}
          DISPATCH_ONLY: ${{ inputs.mode == '' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          PROFILE: ${{ inputs.profile || 'all' }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == zoujingli/typeapp && "$SOURCE" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$DISPATCH_ONLY" == false || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || exit 1
          [[ "$(git rev-parse --verify "$SOURCE^{commit}")" == "$SOURCE" ]] || exit 1
          git merge-base --is-ancestor "$SOURCE" origin/main || exit 1
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || exit 1
          if [[ "$MODE" == candidate ]]; then
            [[ "$REFERENCE" == "$SOURCE" ]] || exit 1
          else
            [[ "$MODE" == public && "$DISPATCH_ONLY" == false && "$REFERENCE" == "$VERSION" ]] || exit 1
            [[ "$(git rev-parse --verify "refs/tags/$VERSION^{commit}")" == "$SOURCE" ]] || exit 1
          fi
          # 发布复用入口不接受筛选，始终保留四平台和三个数据库。
          if [[ "$DISPATCH_ONLY" == false ]]; then
            PLATFORM=all
            PROFILE=all
          fi
          case "$PLATFORM" in all|linux-x64|linux-arm64|macos-arm64|windows-x64) ;; *) exit 1 ;; esac
          case "$PROFILE" in all|sqlite|mysql|pgsql) ;; *) exit 1 ;; esac
          PROFILES='["sqlite","mysql","pgsql"]'
          if [[ "$PROFILE" != all ]]; then
            PROFILES="$(jq -cn --arg profile "$PROFILE" '[$profile]')"
          fi
          FULL=false
          if [[ "$PLATFORM" == all && "$PROFILE" == all ]]; then FULL=true; fi
          printf 'source=%s\nversion=%s\nmode=%s\nreference=%s\n' "$SOURCE" "$VERSION" "$MODE" "$REFERENCE" >> "$GITHUB_OUTPUT"
          printf 'platform=%s\nprofile=%s\nprofiles=%s\nfull=%s\n' "$PLATFORM" "$PROFILE" "$PROFILES" "$FULL" >> "$GITHUB_OUTPUT"

  linux:
    needs: resolve
    if: needs.resolve.outputs.platform == 'all' || startsWith(needs.resolve.outputs.platform, 'linux-')
    uses: ./.github/workflows/static-linux.yml
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.resolve.outputs.profiles) }}
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: ''
      version: ${{ needs.resolve.outputs.version }}
      profile: ${{ matrix.profile }}
      platform: ${{ needs.resolve.outputs.platform }}
      tutorial_mode: ${{ needs.resolve.outputs.mode }}
      tutorial_reference: ${{ needs.resolve.outputs.reference }}

  macos:
    needs: resolve
    if: needs.resolve.outputs.platform == 'all' || needs.resolve.outputs.platform == 'macos-arm64'
    uses: ./.github/workflows/native-macos.yml
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.resolve.outputs.profiles) }}
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: ''
      version: ${{ needs.resolve.outputs.version }}
      scope: single-program
      profile: ${{ matrix.profile }}
      tutorial_mode: ${{ needs.resolve.outputs.mode }}
      tutorial_reference: ${{ needs.resolve.outputs.reference }}

  windows:
    needs: resolve
    if: needs.resolve.outputs.platform == 'all' || needs.resolve.outputs.platform == 'windows-x64'
    uses: ./.github/workflows/static-windows-candidate.yml
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.resolve.outputs.profiles) }}
    with:
      source_sha: ${{ needs.resolve.outputs.source }}
      frontend_artifact: ''
      version: ${{ needs.resolve.outputs.version }}
      profile: ${{ matrix.profile }}
      tutorial_mode: ${{ needs.resolve.outputs.mode }}
      tutorial_reference: ${{ needs.resolve.outputs.reference }}

  complete:
    needs: [resolve, linux, macos, windows]
    if: always()
    name: ${{ needs.resolve.outputs.full == 'true' && 'complete' || '定向教程结果（非发布验收）' }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          PLATFORM: ${{ needs.resolve.outputs.platform }}
          PROFILE: ${{ needs.resolve.outputs.profile }}
          FULL: ${{ needs.resolve.outputs.full }}
        run: |
          set -euo pipefail
          jq -e --arg platform "$PLATFORM" '
            .resolve.result == "success"
            and .linux.result == (if $platform == "all" or ($platform | startswith("linux-")) then "success" else "skipped" end)
            and .macos.result == (if $platform == "all" or $platform == "macos-arm64" then "success" else "skipped" end)
            and .windows.result == (if $platform == "all" or $platform == "windows-x64" then "success" else "skipped" end)
          ' <<< "$RESULTS"
          if [[ "$FULL" == true ]]; then
            printf '四平台、三个数据库的教程任务已全部成功；发布仍需核对同轮十二份原始产物证据。\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '定向教程检查通过：平台 %s，数据库 %s。\n\n本轮仅为局部验收，不生成 tutorial-delivery-matrix，不能作为发布完整教程汇总。\n' "$PLATFORM" "$PROFILE" >> "$GITHUB_STEP_SUMMARY"
          fi
