<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" role="img" aria-labelledby="orbit-title orbit-desc">
  <title id="orbit-title">物联中心业务架构</title>
  <desc id="orbit-desc">左侧是 MQTT 设备、人员控制台和自定义套接字等接入；中间是成品案例「物联中心」的 MQTT 接入、HTTP 服务、数据接收与持久存储；右侧是双端控制台、数据运维，以及用 type-project 扩展的其他业务。</desc>
  <defs>
    <pattern id="orbit-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#65dfbb" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="orbit-core" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a3d34"/>
      <stop offset="100%" stop-color="#0c211c"/>
    </radialGradient>
    <linearGradient id="orbit-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122e26"/>
      <stop offset="100%" stop-color="#0c211c"/>
    </linearGradient>
    <filter id="orbit-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orbit-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .orbit-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .kicker { fill: #99b6a9; font-size: 11px; letter-spacing: .18em; }
      .pill-label { fill: #e4f5ed; font-size: 14px; font-weight: 600; }
      .hub-name { fill: #e4f5ed; font-size: 15px; font-weight: 700; }
      .hub-sub { fill: #99b6a9; font-size: 10px; }
      .hub-role { fill: #b6f2de; font-size: 11px; font-weight: 600; }
      .card-title { fill: #e4f5ed; font-size: 14px; font-weight: 650; }
      .chip { fill: #99b6a9; font-size: 11px; }
      .flow {
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 6 16;
        animation: orbit-dash 2.8s linear infinite;
      }
      .flow-in { stroke: #65dfbb; stroke-width: 1.35; stroke-opacity: .75; }
      .flow-out { stroke: #8dc8f4; stroke-width: 1.35; stroke-opacity: .7; }
      .packet { fill: #65dfbb; filter: url(#orbit-glow); animation: orbit-packet 3.6s linear infinite; offset-rotate: 0deg; }
      @supports not (offset-path: path('M0 0')) { .packet, .packet-b { display: none; } }
      .packet-b { fill: #8dc8f4; animation-duration: 4.2s; animation-delay: .8s; }
      .ring-spin { transform-origin: 0 0; animation: orbit-spin 22s linear infinite; }
      .pulse { animation: orbit-pulse 2.8s ease-in-out infinite; }
      .pulse-slow { animation: orbit-pulse 4.2s ease-in-out infinite; }
      @keyframes orbit-dash { to { stroke-dashoffset: -88; } }
      @keyframes orbit-spin { to { transform: rotate(360deg); } }
      @keyframes orbit-pulse {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
      }
      @keyframes orbit-packet {
        from { offset-distance: 0%; }
        to { offset-distance: 100%; }
      }
      .p1 { offset-path: path("M204 82 C 320 82, 360 270, 412 270"); animation-delay: 0s; }
      .p2 { offset-path: path("M204 142 C 318 142, 358 270, 412 270"); animation-delay: .45s; }
      .p3 { offset-path: path("M204 202 C 316 202, 356 270, 412 270"); animation-delay: .9s; }
      .p4 { offset-path: path("M204 262 C 314 262, 354 270, 412 270"); animation-delay: 1.35s; }
      .p5 { offset-path: path("M204 322 C 316 322, 356 270, 412 270"); animation-delay: 1.8s; }
      .p6 { offset-path: path("M204 382 C 320 382, 360 270, 412 270"); animation-delay: 2.25s; }
      .q1 { offset-path: path("M648 270 C 710 270, 730 118, 780 118"); }
      .q2 { offset-path: path("M648 270 C 710 270, 730 270, 780 270"); }
      .q3 { offset-path: path("M648 270 C 710 270, 730 422, 780 422"); }
      @media (prefers-reduced-motion: reduce) {
        .flow, .packet, .packet-b, .ring-spin, .pulse, .pulse-slow { animation: none !important; }
        .packet, .packet-b { display: none; }
        .flow { stroke-dasharray: none; }
      }
    </style>
  </defs>
  <g class="orbit-root">
    <rect width="1120" height="540" rx="18" fill="#0c211c"/>
    <rect width="1120" height="540" rx="18" fill="url(#orbit-grid)"/>
    <rect width="1120" height="540" rx="18" fill="none" stroke="#2c4a3f"/>

    <text class="kicker" x="48" y="36">现场接入</text>
    <text class="kicker" x="780" y="36">使用与延伸</text>

    <!-- left pills -->
    <g id="pill-1">
      <rect x="36" y="56" width="168" height="52" rx="26" fill="#122e26" stroke="#65dfbb" stroke-opacity=".85"/>
      <circle cx="62" cy="82" r="12" fill="#0c211c" stroke="#65dfbb"/>
      <path d="M55 86c4.5-6 9.5-6 14 0M57.2 83.2c3-3.6 6.6-3.6 9.6 0" stroke="#65dfbb" stroke-width="1.5" fill="none"/>
      <circle cx="62" cy="88.2" r="1.5" fill="#65dfbb"/>
      <text class="pill-label" x="84" y="87">MQTT 设备</text>
    </g>
    <g id="pill-2">
      <rect x="36" y="116" width="168" height="52" rx="26" fill="#122e26" stroke="#8dc8f4" stroke-opacity=".8"/>
      <circle cx="62" cy="142" r="12" fill="#0c211c" stroke="#8dc8f4"/>
      <path d="M62 148V136m-4 4 4-4 4 4" stroke="#8dc8f4" stroke-width="1.6" fill="none"/>
      <text class="pill-label" x="84" y="147">遥测上报</text>
    </g>
    <g id="pill-3">
      <rect x="36" y="176" width="168" height="52" rx="26" fill="#122e26" stroke="#b6f2de" stroke-opacity=".8"/>
      <circle cx="62" cy="202" r="12" fill="#0c211c" stroke="#b6f2de"/>
      <path d="M62 196v12m-4-3 4 4 4-4" stroke="#b6f2de" stroke-width="1.6" fill="none"/>
      <text class="pill-label" x="84" y="207">指令执行</text>
    </g>
    <g id="pill-4">
      <rect x="36" y="236" width="168" height="52" rx="26" fill="#122e26" stroke="#147d64" stroke-opacity=".95"/>
      <circle cx="62" cy="262" r="12" fill="#0c211c" stroke="#147d64"/>
      <circle cx="62" cy="258" r="3.2" fill="none" stroke="#147d64" stroke-width="1.5"/>
      <path d="M55 268c2-5 12-5 14 0" fill="none" stroke="#147d64" stroke-width="1.5"/>
      <text class="pill-label" x="84" y="267">管理端</text>
    </g>
    <g id="pill-5">
      <rect x="36" y="296" width="168" height="52" rx="26" fill="#122e26" stroke="#e8c789" stroke-opacity=".75"/>
      <circle cx="62" cy="322" r="12" fill="#0c211c" stroke="#e8c789"/>
      <rect x="56" y="316" width="12" height="12" rx="2" fill="none" stroke="#e8c789" stroke-width="1.5"/>
      <text class="pill-label" x="84" y="327">SaaS 客户端</text>
    </g>
    <g id="pill-6">
      <rect x="36" y="356" width="168" height="52" rx="26" fill="#122e26" stroke="#99b6a9" stroke-opacity=".9"/>
      <circle cx="62" cy="382" r="12" fill="#0c211c" stroke="#99b6a9"/>
      <path d="M56 382h12M58 378h8M58 386h8" stroke="#99b6a9" stroke-width="1.5"/>
      <text class="pill-label" x="84" y="387">TCP / UDP</text>
    </g>

    <!-- inbound flows -->
    <path class="flow flow-in" d="M204 82 C 320 82, 360 270, 412 270"/>
    <path class="flow flow-in" d="M204 142 C 318 142, 358 270, 412 270"/>
    <path class="flow flow-in" d="M204 202 C 316 202, 356 270, 412 270"/>
    <path class="flow flow-in" d="M204 262 C 314 262, 354 270, 412 270"/>
    <path class="flow flow-in" d="M204 322 C 316 322, 356 270, 412 270"/>
    <path class="flow flow-in" d="M204 382 C 320 382, 360 270, 412 270"/>
    <circle class="packet p1" r="3.2" cx="0" cy="0"/>
    <circle class="packet p2" r="3.2" cx="0" cy="0"/>
    <circle class="packet p3" r="3.2" cx="0" cy="0"/>
    <circle class="packet p4" r="3.2" cx="0" cy="0"/>
    <circle class="packet p5" r="3.2" cx="0" cy="0"/>
    <circle class="packet p6" r="3.2" cx="0" cy="0"/>

    <!-- hub -->
    <g transform="translate(530 270)">
      <circle class="pulse-slow" r="148" fill="none" stroke="#65dfbb" stroke-opacity=".16" stroke-width="1"/>
      <circle class="pulse" r="136" fill="none" stroke="#65dfbb" stroke-opacity=".28" stroke-width="1.2" filter="url(#orbit-glow)"/>
      <g class="ring-spin"><circle r="128" fill="none" stroke="#65dfbb" stroke-opacity=".45" stroke-width="1.1" stroke-dasharray="4 10"/></g>
      <circle r="118" fill="#0c211c" stroke="#2c4a3f" stroke-width="1.4"/>
      <circle r="118" fill="url(#orbit-core)" fill-opacity=".92"/>

      <!-- four roles -->
      <g>
        <circle cx="0" cy="-78" r="16" fill="#122e26" stroke="#65dfbb"/>
        <path d="M-6 -82h12v8h-12zM-4 -74h8" fill="none" stroke="#65dfbb" stroke-width="1.4"/>
        <text class="hub-role" text-anchor="middle" x="0" y="-102">HTTP 服务</text>
      </g>
      <g>
        <circle cx="78" cy="0" r="16" fill="#122e26" stroke="#8dc8f4"/>
        <path d="M72 -4h12v8H72z" fill="none" stroke="#8dc8f4" stroke-width="1.4"/>
        <text class="hub-role" text-anchor="start" x="100" y="4">数据接收</text>
      </g>
      <g>
        <circle cx="0" cy="78" r="16" fill="#122e26" stroke="#e8c789"/>
        <ellipse cx="0" cy="74" rx="7" ry="3" fill="none" stroke="#e8c789" stroke-width="1.4"/>
        <path d="M-7 74v7c0 2 14 2 14 0v-7" fill="none" stroke="#e8c789" stroke-width="1.4"/>
        <text class="hub-role" text-anchor="middle" x="0" y="110">持久存储</text>
      </g>
      <g>
        <circle cx="-78" cy="0" r="16" fill="#122e26" stroke="#b6f2de"/>
        <path d="M-84 0c4-6 12-6 16 0M-82 4c3-4 9-4 12 0" fill="none" stroke="#b6f2de" stroke-width="1.4"/>
        <text class="hub-role" text-anchor="end" x="-100" y="4">MQTT 接入</text>
      </g>

      <circle r="40" fill="#122e26" stroke="#65dfbb" stroke-width="1.6" filter="url(#orbit-glow)"/>
      <circle class="pulse" r="40" fill="none" stroke="#65dfbb" stroke-opacity=".7"/>
      <text class="hub-name" text-anchor="middle" x="0" y="-2">物联中心</text>
      <text class="hub-sub" text-anchor="middle" x="0" y="14">TypeApp 成品案例</text>
    </g>

    <!-- outbound flows -->
    <path class="flow flow-out" d="M648 270 C 710 270, 730 118, 780 118"/>
    <path class="flow flow-out" d="M648 270 C 710 270, 730 270, 780 270"/>
    <path class="flow flow-out" d="M648 270 C 710 270, 730 422, 780 422"/>
    <circle class="packet packet-b q1" r="3.2" cx="0" cy="0"/>
    <circle class="packet packet-b q2" r="3.2" cx="0" cy="0"/>
    <circle class="packet packet-b q3" r="3.2" cx="0" cy="0"/>

    <!-- right cards -->
    <g>
      <rect x="780" y="56" width="304" height="124" rx="16" fill="url(#orbit-card)" stroke="#2c4a3f"/>
      <text class="card-title" x="800" y="84">双端控制台</text>
      <rect x="800" y="102" width="72" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="836" y="120">管理端</text>
      <rect x="880" y="102" width="72" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="916" y="120">客户端</text>
      <rect x="960" y="102" width="72" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="996" y="120">RBAC</text>
      <text class="hub-sub" x="800" y="154">Vben 管理端 · /admin 与 /customer</text>
    </g>
    <g>
      <rect x="780" y="208" width="304" height="124" rx="16" fill="url(#orbit-card)" stroke="#2c4a3f"/>
      <text class="card-title" x="800" y="236">数据与运维</text>
      <rect x="800" y="254" width="72" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="836" y="272">历史</text>
      <rect x="880" y="254" width="72" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="916" y="272">告警</text>
      <rect x="960" y="254" width="72" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="996" y="272">导出</text>
      <text class="hub-sub" x="800" y="306">接收、统计、通知分角色运行</text>
    </g>
    <g>
      <rect x="780" y="360" width="304" height="124" rx="16" fill="url(#orbit-card)" stroke="#2c4a3f"/>
      <text class="card-title" x="800" y="388">其他业务</text>
      <rect x="800" y="406" width="88" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="844" y="424">type-project</text>
      <rect x="896" y="406" width="80" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="936" y="424">type-xxxx</text>
      <rect x="984" y="406" width="76" height="26" rx="8" fill="#0c211c" stroke="#2c4a3f"/>
      <text class="chip" text-anchor="middle" x="1022" y="424">TypePHP</text>
      <text class="hub-sub" x="800" y="458">模板加组件，不必复制物联中心</text>
    </g>
  </g>
</svg>
