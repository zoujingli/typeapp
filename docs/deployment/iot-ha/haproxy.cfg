global
    maxconn 4000

defaults
    mode tcp
    timeout connect 3s
    timeout client 35s
    timeout server 35s
    timeout check 2s
    retries 0

listen iot_postgresql_writer
    bind "${IOT_HA_LISTEN}"
    option httpchk
    http-check connect ssl
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host "${IOT_HA_HEALTH_HOST}"
    http-check expect status 200
    default-server init-state fully-down inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server iot_a "${IOT_HA_DB_A}" check port "${IOT_HA_API_PORT_A}" check-ssl verify required ca-file "${IOT_HA_CA}" crt "${IOT_HA_CLIENT_PEM}" verifyhost "${IOT_HA_HOST_A}"
    server iot_b "${IOT_HA_DB_B}" check port "${IOT_HA_API_PORT_B}" check-ssl verify required ca-file "${IOT_HA_CA}" crt "${IOT_HA_CLIENT_PEM}" verifyhost "${IOT_HA_HOST_B}"
    server iot_c "${IOT_HA_DB_C}" check port "${IOT_HA_API_PORT_C}" check-ssl verify required ca-file "${IOT_HA_CA}" crt "${IOT_HA_CLIENT_PEM}" verifyhost "${IOT_HA_HOST_C}"
